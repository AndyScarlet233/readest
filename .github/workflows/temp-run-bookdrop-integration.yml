name: Temporary run BookDrop integration with submodules

on:
  push:
    branches:
      - integrate/upstream-nearby-bookdrop-v2-2026-09-04
    paths:
      - .github/workflows/temp-run-bookdrop-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout integration branch with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Execute guarded integration script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/temp-apply-bookdrop-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |') + 1
          script = []
          for line in lines[start:]:
              if line.startswith('          '):
                  script.append(line[10:])
              elif not line.strip():
                  script.append('')
              else:
                  break
          Path('/tmp/bookdrop-integration.sh').write_text('\n'.join(script) + '\n')
          PY
          bash /tmp/bookdrop-integration.sh
