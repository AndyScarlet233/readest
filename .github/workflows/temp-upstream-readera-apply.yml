name: Temporary upstream ReadEra apply

on:
  push:
    branches:
      - integrate/upstream-readera-2026-09-04
    paths:
      - .github/workflows/temp-upstream-readera-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply upstream ReadEra import while preserving fork locales
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit='8b8fbe14d9051e0ec1632849b08b3e622b4cc823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-tags upstream "$upstream_commit"

          if ! git cherry-pick "$upstream_commit"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^apps/readest-app/public/locales/[^/]+/translation\.json$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected non-locale ReadEra conflicts:'
              printf '%s\n' "$unexpected"
              exit 1
            fi

            for file in $conflicts; do
              git checkout --ours -- "$file"
            done

            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          commit = '8b8fbe14d9051e0ec1632849b08b3e622b4cc823'
          keys = [
              'Select ReadEra Backup File',
              'This is not a ReadEra backup file.',
              'This book was not found in the ReadEra backup.',
              'ReadEra',
              'ReadEra backup file (.bak)',
          ]
          for path in Path('apps/readest-app/public/locales').glob('*/translation.json'):
              rel = path.as_posix()
              try:
                  raw = subprocess.check_output(['git', 'show', f'{commit}:{rel}'], text=True)
              except subprocess.CalledProcessError:
                  continue
              upstream = json.loads(raw)
              ours = json.loads(path.read_text())
              changed = False
              for key in keys:
                  if key in upstream:
                      ours[key] = upstream[key]
                      changed = True
              if changed:
                  path.write_text(json.dumps(ours, ensure_ascii=False, indent=2) + '\n')
          PY

            git add apps/readest-app/public/locales/*/translation.json
            git cherry-pick --continue
          fi

          git diff --check HEAD~1..HEAD
          git push origin HEAD:integrate/upstream-readera-2026-09-04
