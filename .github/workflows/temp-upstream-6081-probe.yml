name: "Temporary upstream #6081 validation"
run-name: "Upstream #6081 final validation · #${{ github.run_number }}"

on:
  push:
    branches:
      - integrate/upstream-6067-6081-2026-09-06
    paths:
      - '.github/workflows/temp-upstream-6081-probe.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_POSTHOG_KEY: ''
      SENTRY_DSN: ''
    steps:
      - name: Checkout validated replay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore fork barcode-scanner source without restoring fs patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "8d95c6a4af0eadf9dc394711ac0f2f209da498a2"
          git checkout origin/main -- .gitmodules packages/tauri-plugins
          git submodule sync -- packages/tauri-plugins
          git submodule update --init packages/tauri-plugins
          test "$(git -C packages/tauri-plugins rev-parse HEAD)" = "4350ca652d33e3face88d7c97a78830553545550"
          grep -q '^tauri-plugin-barcode-scanner = { path = "../../../packages/tauri-plugins/plugins/barcode-scanner" }' apps/readest-app/src-tauri/Cargo.toml
          ! grep -q '^tauri-plugin-fs = { path = "packages/tauri-plugins/plugins/fs" }' Cargo.toml
          ! grep -q '^tauri-plugin-fs = { path = "packages/tauri-plugins/plugins/fs" }' Cargo.lock || true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android

      - name: Verify Rust is new enough for CEF
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          minor="$(rustc --version | sed -E 's/^rustc 1\.([0-9]+).*/\1/')"
          test "$minor" -ge 95

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: upstream-6081-wry-cef-android
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android NDK and Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libsoup-3.0-dev xvfb jq

      - name: Re-resolve fork Wry and CEF Cargo locks
        shell: bash
        run: |
          set -euo pipefail
          # Wry graph: restore the fork barcode-scanner path dependency and let
          # Cargo update the 2.11.5 graph. Verify the readest Tauri path patch is
          # actually selected rather than silently falling back to crates.io.
          cargo metadata --format-version 1 > /tmp/wry-metadata.json
          jq -e '[.packages[] | select(.name == "tauri") | .manifest_path] | any(contains("/packages/tauri/crates/tauri/Cargo.toml"))' /tmp/wry-metadata.json

          # CEF has a separate committed resolution. Swap it in exactly as the
          # Linux tauri wrapper does, minimally re-resolve for the fork-only
          # barcode plugin, then restore the Wry lock.
          cp Cargo.lock /tmp/Cargo.lock.wry
          cp Cargo.cef.lock Cargo.lock
          (
            cd apps/readest-app/src-tauri
            cargo metadata --format-version 1 --no-default-features --features cef \
              --config .cargo/cef.toml > /tmp/cef-metadata.json
          )
          cp Cargo.lock Cargo.cef.lock
          cp /tmp/Cargo.lock.wry Cargo.lock
          jq -e '[.packages[] | select(.name == "tauri") | (.source // "")] | any(contains("git+https://github.com/readest/tauri"))' /tmp/cef-metadata.json
          grep -q 'name = "tauri-plugin-barcode-scanner"' Cargo.lock
          grep -q 'name = "tauri-plugin-barcode-scanner"' Cargo.cef.lock
          git add .gitmodules packages/tauri-plugins Cargo.lock Cargo.cef.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare frontend vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Write deterministic test environment
        shell: bash
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
          SENTRY_DSN=
          EOF
          cp .env.local apps/readest-app/.env.local

      - name: TypeScript typecheck
        run: pnpm --filter @readest/readest-app exec tsc --noEmit

      - name: Run upstream and fork reader regressions
        run: |
          pnpm --filter @readest/readest-app exec vitest run \
            src/__tests__/components/useBookShortcuts.test.tsx \
            src/__tests__/components/UpdaterWindow.test.tsx \
            src/__tests__/components/ViewTransitions.test.tsx \
            src/__tests__/hooks/useAppRouter.test.ts \
            src/__tests__/services/translators/providers.test.ts \
            src/__tests__/components/SearchBar.test.tsx \
            src/__tests__/services/tts-controller.test.ts \
            src/__tests__/store/reader-store.test.ts \
            src/__tests__/hooks/useTTSDownloads.test.tsx \
            src/__tests__/services/tts-download-chapters.test.ts \
            src/__tests__/utils/window.test.ts \
            src/__tests__/foliate-pdf-redundant-render.test.ts \
            src/__tests__/components/annotator/AnnotatorShortcuts.test.tsx \
            src/__tests__/app/reader/foliate-viewer-relocate.test.tsx \
            src/__tests__/services/tts-book-cache-store.test.ts \
            src/__tests__/services/tts-pack-compaction.test.ts \
            src/__tests__/services/query-range-reads.test.ts \
            src/__tests__/utils/window-pointer-drag.test.ts \
            src/__tests__/components/ImageViewer.test.tsx \
            src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts \
            src/__tests__/reader/utils/iframeEventHandlers.test.ts \
            --maxWorkers=2

      - name: Install Chromium for browser regressions
        run: pnpm --filter @readest/readest-app exec playwright install --with-deps chromium

      - name: Run annotation and fixed-layout browser regressions
        run: |
          pnpm --filter @readest/readest-app exec vitest run \
            --config vitest.browser.config.mts \
            src/__tests__/components/annotation-popup-layout.browser.test.tsx \
            src/__tests__/document/fixed-layout-pan-lock.browser.test.ts \
            src/__tests__/document/pdf-pan-lock.browser.test.ts

      - name: Check and test normal Wry Rust graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p Readest --locked
          cargo test -p Readest --lib --locked

      - name: Check Linux CEF Rust graph with its committed lock
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.wry-check
          cp Cargo.cef.lock Cargo.lock
          cleanup() {
            cp Cargo.lock Cargo.cef.lock
            cp /tmp/Cargo.lock.wry-check Cargo.lock
          }
          trap cleanup EXIT
          (
            cd apps/readest-app/src-tauri
            cargo check -p Readest --locked --no-default-features --features cef \
              --config .cargo/cef.toml
          )
          cleanup
          trap - EXIT
          git add Cargo.lock Cargo.cef.lock

      - name: Regenerate Android scaffolding
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init

      - name: Build Google Play Android debug app through Tauri
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ORG_GRADLE_PROJECT_storeFlavor: googleplay
        run: |
          cd apps/readest-app
          pnpm tauri android build --debug -t aarch64 --config src-tauri/tauri.fork.conf.json
          test -f src-tauri/gen/android/tauri.settings.gradle
          test -f src-tauri/gen/android/app/tauri.build.gradle.kts

      - name: Run Google Play billing bridge unit tests
        env:
          ORG_GRADLE_PROJECT_storeFlavor: googleplay
        run: |
          cd apps/readest-app/src-tauri/gen/android
          chmod +x ./gradlew
          ./gradlew testGoogleplayDebugUnitTest --stacktrace

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Refresh fork-specific Nix dependency hashes
        shell: bash
        run: |
          set -euo pipefail
          refresh_hash() {
            kind="$1"
            target="$2"
            python - "$kind" <<'PY'
          from pathlib import Path
          import re, sys
          kind = sys.argv[1]
          path = Path('nix/package.nix')
          text = path.read_text()
          if kind == 'pnpm':
              start = text.index('  pnpmDeps = fetchPnpmDeps {')
              end = text.index('  cargoRoot =', start)
              block = text[start:end]
              block, n = re.subn(r'    hash = "sha256-[^"]+";', '    hash = lib.fakeHash;', block, count=1)
          elif kind == 'cargo':
              block, n = re.subn(r'  cargoHash = "sha256-[^"]+";', '  cargoHash = lib.fakeHash;', text, count=1)
              if n != 1: raise SystemExit('cargoHash replacement failed')
              path.write_text(block)
              raise SystemExit(0)
          elif kind == 'turso':
              start = text.index('  tursoPluginDeps = fetchPnpmDeps {')
              end = text.index('  tursoPlugin =', start)
              block = text[start:end]
              block, n = re.subn(r'    hash = "sha256-[^"]+";', '    hash = lib.fakeHash;', block, count=1)
          else:
              raise SystemExit(f'unknown hash kind {kind}')
          if n != 1: raise SystemExit(f'{kind} hash replacement failed')
          path.write_text(text[:start] + block + text[end:])
          PY

            set +e
            nix build -L "$target" 2>&1 | tee "/tmp/nix-${kind}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::error::Expected fake hash mismatch for $kind, but build succeeded"
              exit 1
            fi
            got="$(grep -E 'got:[[:space:]]+sha256-' "/tmp/nix-${kind}.log" | tail -1 | sed -E 's/.*got:[[:space:]]+(sha256-[A-Za-z0-9+\/=]+).*/\1/')"
            if [ -z "$got" ]; then
              echo "::error::Could not extract Nix got hash for $kind"
              exit 1
            fi
            echo "$kind => $got"
            python - "$kind" "$got" <<'PY'
          from pathlib import Path
          import sys
          kind, got = sys.argv[1], sys.argv[2]
          path = Path('nix/package.nix')
          text = path.read_text()
          if kind == 'cargo':
              old = '  cargoHash = lib.fakeHash;'
              new = f'  cargoHash = "{got}";'
          else:
              old = '    hash = lib.fakeHash;'
              new = f'    hash = "{got}";'
          if old not in text:
              raise SystemExit(f'fake hash marker missing for {kind}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          }

          refresh_hash pnpm .#default.pnpmDeps
          refresh_hash cargo .#default.cargoDeps
          refresh_hash turso .#default.tursoPluginDeps
          git add nix/package.nix
          nix build -L --keep-going \
            .#default.pnpmDeps \
            .#default.tursoPluginDeps \
            .#default.cargoDeps

      - name: Recheck fork protections and official upstream head
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- .github/workflows/release.yml
          test "$(git rev-parse 2c682cda4404bc23378bfad640da11250ec30231:apps/readest-app/src/utils/access.ts)" = "$(git rev-parse origin/main:apps/readest-app/src/utils/access.ts)"
          test "$(git rev-parse 2c682cda4404bc23378bfad640da11250ec30231:apps/readest-app/src/pages/api/storage/stats.ts)" = "$(git rev-parse origin/main:apps/readest-app/src/pages/api/storage/stats.ts)"
          test "$(git rev-parse 2c682cda4404bc23378bfad640da11250ec30231:apps/readest-app/src/app/reader/hooks/usePagination.ts)" = "$(git rev-parse origin/main:apps/readest-app/src/app/reader/hooks/usePagination.ts)"
          test "$(git rev-parse 2c682cda4404bc23378bfad640da11250ec30231:apps/readest-app/src-tauri/tauri.fork.conf.json)" = "$(git rev-parse origin/main:apps/readest-app/src-tauri/tauri.fork.conf.json)"
          grep -q '"localsend_send_files"' apps/readest-app/src-tauri/build.rs
          grep -q '"lan_sync_start"' apps/readest-app/src-tauri/build.rs
          grep -q '"iap_purchase_product"' apps/readest-app/src-tauri/plugins/tauri-plugin-native-bridge/build.rs
          grep -q '"icloud_container_status"' apps/readest-app/src-tauri/plugins/tauri-plugin-native-bridge/build.rs
          grep -q '"set_multicast_lock"' apps/readest-app/src-tauri/plugins/tauri-plugin-native-bridge/build.rs
          grep -q '"set_sync_passphrase"' apps/readest-app/src-tauri/plugins/tauri-plugin-native-bridge/build.rs

          git remote add official-upstream https://github.com/readest/readest.git || true
          git fetch --no-tags official-upstream main
          test "$(git rev-parse official-upstream/main)" = "ee86510ccaf736c2cf887add305c5344420ab0a3"

      - name: Commit validated fork reconciliation and remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add .gitmodules packages/tauri-plugins Cargo.lock Cargo.cef.lock nix/package.nix
          git rm .github/workflows/temp-upstream-6081-probe.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "chore(upstream): validate fork replay through #6081"
          HUSKY=0 git push origin HEAD:${GITHUB_REF_NAME}
