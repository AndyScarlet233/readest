name: One-shot CBZ page drag fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cbz-page-drag.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply CBZ page-drag fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/readest-app/src/app/reader/hooks/usePagination.ts')
          s = p.read_text()

          old = """const isFixedLayoutView = (view: FoliateView | null, storedFixedLayout?: boolean) =>\n  Boolean(\n    storedFixedLayout || view?.isFixedLayout || view?.book?.rendition?.layout === 'pre-paginated',\n  );\n"""
          new = old + """\nconst canMousePageDrag = (\n  view: FoliateView | null,\n  viewSettings: ViewSettings | null | undefined,\n  format?: string,\n) => Boolean(format === 'CBZ' && !viewSettings?.disableSwipe && !isPanningView(view, viewSettings));\n\nconst setMousePageDragPreview = (view: FoliateView | null, deltaX: number) => {\n  const renderer = view?.renderer as (HTMLElement & { style?: CSSStyleDeclaration }) | undefined;\n  if (!renderer?.style) return;\n  const width = Number(renderer.clientWidth) || 800;\n  const clampedX = Math.max(-width * 0.45, Math.min(width * 0.45, deltaX));\n  renderer.style.translate = `${clampedX}px 0`;\n  renderer.style.willChange = 'translate';\n};\n\nconst clearMousePageDragPreview = (view: FoliateView | null) => {\n  const renderer = view?.renderer as (HTMLElement & { style?: CSSStyleDeclaration }) | undefined;\n  if (!renderer?.style) return;\n  renderer.style.translate = '';\n  renderer.style.willChange = '';\n};\n"""
          if old not in s:
              raise SystemExit('isFixedLayoutView anchor not found')
          s = s.replace(old, new, 1)

          old = """    const horizontal = hasHorizontalPanning(view, settings);\n    const vertical = hasVerticalPanning(view, settings);\n    // Track the whole primary-button lifetime for fixed-layout pages. Overflow can\n    // change after resize/zoom, so it must not be a hard gate for starting a drag.\n    setMousePanArmed(\n      bookKey,\n      Boolean(isFixedLayoutView(view, data?.isFixedLayout) && !settings?.scrolled),\n      { horizontal, vertical },\n    );\n    return () => {\n      mousePanRef.current = null;\n      setMousePanArmed(bookKey, false);\n      setMousePanClaimed(bookKey, false);\n    };\n"""
          new = """    const horizontal = hasHorizontalPanning(view, settings);\n    const vertical = hasVerticalPanning(view, settings);\n    const page = canMousePageDrag(view, settings, data?.book?.format);\n    // Track the whole primary-button lifetime for fixed-layout pages. Overflow can\n    // change after resize/zoom, so it must not be a hard gate for starting a drag.\n    setMousePanArmed(\n      bookKey,\n      Boolean(isFixedLayoutView(view, data?.isFixedLayout) && !settings?.scrolled),\n      { horizontal, vertical, page },\n    );\n    return () => {\n      clearMousePageDragPreview(view);\n      mousePanRef.current = null;\n      setMousePanArmed(bookKey, false);\n      setMousePanClaimed(bookKey, false);\n    };\n"""
          if old not in s:
              raise SystemExit('effect anchor not found')
          s = s.replace(old, new, 1)

          old = """        const state = mousePanRef.current;\n        mousePanRef.current = null;\n        setMousePanArmed(bookKey, false);\n        setMousePanClaimed(bookKey, false);\n        if (\n"""
          new = """        const state = mousePanRef.current;\n        if (state?.mode === 'page') clearMousePageDragPreview(view);\n        mousePanRef.current = null;\n        setMousePanArmed(bookKey, false);\n        setMousePanClaimed(bookKey, false);\n        if (\n"""
          if old not in s:
              raise SystemExit('finish anchor not found')
          s = s.replace(old, new, 1)

          old = """        const horizontal = hasHorizontalPanning(view, settings);\n        const vertical = hasVerticalPanning(view, settings);\n        setMousePanArmed(bookKey, canTrack, { horizontal, vertical });\n"""
          new = """        const horizontal = hasHorizontalPanning(view, settings);\n        const vertical = hasVerticalPanning(view, settings);\n        const page = canMousePageDrag(view, settings, data?.book?.format);\n        setMousePanArmed(bookKey, canTrack, { horizontal, vertical, page });\n"""
          if old not in s:
              raise SystemExit('mousedown arm anchor not found')
          s = s.replace(old, new, 1)

          old = """      setMousePanArmed(bookKey, true, { horizontal: horizontalPan, vertical: verticalPan });\n      const canPageDrag = !settings?.disableSwipe && !isPanningView(view, settings);\n"""
          new = """      const canPageDrag = canMousePageDrag(view, settings, data?.book?.format);\n      setMousePanArmed(bookKey, true, {\n        horizontal: horizontalPan,\n        vertical: verticalPan,\n        page: canPageDrag,\n      });\n"""
          if old not in s:
              raise SystemExit('move arm anchor not found')
          s = s.replace(old, new, 1)

          old = """      if (!isFixedLayoutView(view, data?.isFixedLayout) || settings?.scrolled) {\n        mousePanRef.current = null;\n"""
          new = """      if (!isFixedLayoutView(view, data?.isFixedLayout) || settings?.scrolled) {\n        if (state.mode === 'page') clearMousePageDragPreview(view);\n        mousePanRef.current = null;\n"""
          if old not in s:
              raise SystemExit('invalid layout anchor not found')
          s = s.replace(old, new, 1)

          old = """      if (state.mode === 'page') {\n        event.preventDefault?.();\n        return true;\n      }\n"""
          new = """      if (state.mode === 'page') {\n        setMousePageDragPreview(view, totalX);\n        event.preventDefault?.();\n        return true;\n      }\n"""
          if old not in s:
              raise SystemExit('page preview anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('apps/readest-app/src/app/reader/utils/iframeEventHandlers.ts')
          s = p.read_text()
          s = s.replace(
              """interface PanAxes {\n  horizontal: boolean;\n  vertical: boolean;\n}\n""",
              """interface PanAxes {\n  horizontal: boolean;\n  vertical: boolean;\n  page?: boolean;\n}\n""",
              1,
          )
          s = s.replace(
              """  vertical: boolean;\n  claimed: boolean;\n}\n""",
              """  vertical: boolean;\n  claimed: boolean;\n  mode: 'pan' | 'page' | null;\n}\n""",
              1,
          )
          old = """  const deltaX = screenX - gesture.startX;\n  const deltaY = screenY - gesture.startY;\n  if (Math.hypot(deltaX, deltaY) < TOUCH_PAN_THRESHOLD_PX) return false;\n  const horizontal = axes.horizontal && Math.abs(deltaX) >= Math.abs(deltaY);\n  const vertical = axes.vertical && Math.abs(deltaY) > Math.abs(deltaX);\n  if (!horizontal && !vertical) return false;\n  gesture.horizontal = horizontal;\n  gesture.vertical = vertical;\n  gesture.claimed = true;\n"""
          new = """  const deltaX = screenX - gesture.startX;\n  const deltaY = screenY - gesture.startY;\n  const horizontalDominant = Math.abs(deltaX) >= Math.abs(deltaY);\n  const verticalDominant = Math.abs(deltaY) > Math.abs(deltaX);\n  const distance = Math.hypot(deltaX, deltaY);\n  const horizontal =\n    distance >= TOUCH_PAN_THRESHOLD_PX && axes.horizontal && horizontalDominant;\n  const vertical = distance >= TOUCH_PAN_THRESHOLD_PX && axes.vertical && verticalDominant;\n  const page = !horizontal && !vertical && axes.page && horizontalDominant && Math.abs(deltaX) >= 10;\n  if (!horizontal && !vertical && !page) return false;\n  gesture.horizontal = horizontal || Boolean(page);\n  gesture.vertical = vertical;\n  gesture.mode = page ? 'page' : 'pan';\n  gesture.claimed = true;\n"""
          if old not in s:
              raise SystemExit('raw claim anchor not found')
          s = s.replace(old, new, 1)

          marker = """export const setMousePanClaimed = (bookKey: string, claimed: boolean) => {\n  if (claimed) mousePanClaimedBooks.add(bookKey);\n  else mousePanClaimedBooks.delete(bookKey);\n};\n"""
          helper = marker + """\nconst preserveArmedPageAxis = (bookKey: string, axes: PanAxes | null | undefined) =>\n  axes ? { ...axes, page: mousePanArmedBooks.get(bookKey)?.page } : axes;\n"""
          if marker not in s:
              raise SystemExit('setMousePanClaimed anchor not found')
          s = s.replace(marker, helper, 1)

          s = s.replace(
              """    const rawAxes = getRawFixedLayoutPanAxes(event);\n""",
              """    const rawAxes = preserveArmedPageAxis(bookKey, getRawFixedLayoutPanAxes(event));\n""",
              1,
          )
          s = s.replace(
              """        vertical: false,\n        claimed: false,\n      });\n""",
              """        vertical: false,\n        claimed: false,\n        mode: null,\n      });\n""",
              1,
          )
          old = """    const rawAxes =\n      rawRenderer === undefined\n        ? undefined\n        : rawRenderer === null\n          ? null\n          : {\n              horizontal: rawRenderer.isOverflowX === true,\n              vertical: rawRenderer.isOverflowY === true,\n            };\n"""
          new = """    const rawAxes = preserveArmedPageAxis(\n      bookKey,\n      rawRenderer === undefined\n        ? undefined\n        : rawRenderer === null\n          ? null\n          : {\n              horizontal: rawRenderer.isOverflowX === true,\n              vertical: rawRenderer.isOverflowY === true,\n            },\n    );\n"""
          if old not in s:
              raise SystemExit('mousemove raw axes anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              """    if (rawPanClaimed && rawRenderer?.pan) {\n""",
              """    if (rawPanClaimed && gesture.mode === 'pan' && rawRenderer?.pan) {\n""",
              1,
          )
          # Replace the mouseup occurrence, leaving the already-patched mousedown intact.
          old = """    const rawAxes = getRawFixedLayoutPanAxes(event);\n    const axes = rawAxes === undefined ? mousePanArmedBooks.get(bookKey) : rawAxes;\n"""
          new = """    const rawAxes = preserveArmedPageAxis(bookKey, getRawFixedLayoutPanAxes(event));\n    const axes = rawAxes === undefined ? mousePanArmedBooks.get(bookKey) : rawAxes;\n"""
          if old not in s:
              raise SystemExit('mouseup raw axes anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('apps/readest-app/src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts')
          s = p.read_text()
          s = s.replace(
              """  renderer: { scrolled: false },\n""",
              """  renderer: { scrolled: false, clientWidth: 1000, style: { translate: '', willChange: '' } },\n""",
              1,
          )
          s = s.replace(
              """  mocks.getBookData.mockReturnValue({ isFixedLayout: true });\n""",
              """  mocks.getBookData.mockReturnValue({ isFixedLayout: true, book: { format: 'CBZ' } });\n""",
              1,
          )
          old = """    expect(view.pan).not.toHaveBeenCalled();\n    expect(\n      h.result.current.handleMousePan({\n        type: 'iframe-mouseup',\n"""
          new = """    expect(view.pan).not.toHaveBeenCalled();\n    expect(view.renderer.style.translate).toBe('-40px 0');\n    expect(\n      h.result.current.handleMousePan({\n        type: 'iframe-mouseup',\n"""
          if old not in s:
              raise SystemExit('test preview anchor not found')
          s = s.replace(old, new, 1)
          old = """    expect(view.next).toHaveBeenCalledOnce();\n    expect(view.prev).not.toHaveBeenCalled();\n  });\n\n  test('does not turn a zoomed no-overflow view as a page drag', () => {\n"""
          new = """    expect(view.next).toHaveBeenCalledOnce();\n    expect(view.prev).not.toHaveBeenCalled();\n    expect(view.renderer.style.translate).toBe('');\n  });\n\n  test('does not turn a PDF fit-page view through the CBZ mouse page-drag path', () => {\n    const view = makeView(false, false);\n    mocks.getBookData.mockReturnValue({ isFixedLayout: true, book: { format: 'PDF' } });\n    mocks.getViewSettings.mockReturnValue({\n      scrolled: false,\n      zoomLevel: 100,\n      zoomMode: 'fit-page',\n      disableSwipe: false,\n      rtl: false,\n    });\n    const h = renderHook(() =>\n      usePagination('book-1', { current: view as unknown as FoliateView }, { current: null }),\n    );\n\n    h.result.current.handleMousePan(point(100, 100));\n    expect(\n      h.result.current.handleMousePan({\n        type: 'iframe-mousemove',\n        bookKey: 'book-1',\n        buttons: 1,\n        screenX: 50,\n        screenY: 100,\n      }),\n    ).toBe(false);\n    expect(view.renderer.style.translate).toBe('');\n    expect(view.next).not.toHaveBeenCalled();\n    expect(view.prev).not.toHaveBeenCalled();\n  });\n\n  test('does not turn a zoomed no-overflow view as a page drag', () => {\n"""
          if old not in s:
              raise SystemExit('PDF regression insertion anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Format changed files
        run: pnpm exec biome format --write apps/readest-app/src/app/reader/hooks/usePagination.ts apps/readest-app/src/app/reader/utils/iframeEventHandlers.ts apps/readest-app/src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts
      - name: Format check
        run: pnpm -w format:check
      - name: Run CBZ mouse drag regression tests
        working-directory: apps/readest-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
        run: pnpm exec vitest run src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts
      - name: Prepare vendors
        working-directory: apps/readest-app
        run: pnpm setup-vendors
      - name: Type check
        working-directory: apps/readest-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: pnpm exec tsc --noEmit
      - name: Commit fix to main and remove helper
        run: |
          rm .github/workflows/one-shot-cbz-page-drag.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(reader): make fit-page CBZ mouse dragging visible"
          HUSKY=0 git push origin HEAD:main
