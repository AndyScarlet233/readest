name: Temporary fix BookDrop runner

on:
  push:
    branches:
      - integrate/upstream-nearby-bookdrop-v2-2026-09-04
    paths:
      - .github/workflows/temp-fix-bookdrop-runner.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Enable recursive submodules in integration runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -i 's/submodules: false/submodules: recursive/' .github/workflows/temp-apply-bookdrop-v2.yml
          git add .github/workflows/temp-apply-bookdrop-v2.yml
          git commit -m 'chore: initialize submodules for BookDrop integration'
          git push origin HEAD:integrate/upstream-nearby-bookdrop-v2-2026-09-04
