name: Temporary Apple test repair

on:
  push:
    branches:
      - integrate/upstream-account-payment-v2-2026-09-04

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore fixture and apply the one intended mock change
        shell: bash
        run: |
          set -euo pipefail
          file='apps/readest-app/src/__tests__/libs/payment/apple-notifications.test.ts'
          git show 2289a400fbf383d74a4f3bcf8fe5f90e41abd560:"$file" > "$file"
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/readest-app/src/__tests__/libs/payment/apple-notifications.test.ts')
          text = path.read_text()
          old = """            select: () => ({
              eq: () => ({
                single: () => Promise.resolve({ data: state.paymentRow ?? null }),
                in: () => Promise.resolve({ data: state.completedPayments ?? [] }),
              }),
            }),
"""
          new = """            select: (columns?: string) => ({
              eq: () => ({
                single: () =>
                  Promise.resolve({
                    data:
                      columns === 'user_id' && state.existingPaymentOwner !== undefined
                        ? { user_id: state.existingPaymentOwner }
                        : (state.paymentRow ?? null),
                    error: null,
                  }),
                in: () => Promise.resolve({ data: state.completedPayments ?? [] }),
              }),
            }),
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one payments select fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify the repair is minimal
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --numstat 2289a400fbf383d74a4f3bcf8fe5f90e41abd560 -- apps/readest-app/src/__tests__/libs/payment/apple-notifications.test.ts
          changed=$(git diff --numstat 2289a400fbf383d74a4f3bcf8fe5f90e41abd560 -- apps/readest-app/src/__tests__/libs/payment/apple-notifications.test.ts | awk '{print $1+$2}')
          test "$changed" -le 20

      - name: Commit repaired fixture and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/readest-app/src/__tests__/libs/payment/apple-notifications.test.ts
          git rm .github/workflows/temp-repair-apple-test.yml
          git commit -m "test(payment): minimally model Apple owner lookup"
          git push origin HEAD:integrate/upstream-account-payment-v2-2026-09-04
