name: 临时上游同步合并验证 v4

on:
  push:
    branches:
      - sync-upstream-2026-09-02

permissions:
  contents: write

jobs:
  merge-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch upstream and reviewed branch
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/readest/readest.git
          git fetch upstream 46eca1f3fdaa3c23bf1f683019c0ad5cfbc9ce7f
          git fetch origin sync-upstream-2026-09-02
          resolution_ref="$(git rev-parse origin/sync-upstream-2026-09-02)"
          echo "resolution_ref=$resolution_ref" >> "$GITHUB_OUTPUT"
          git show "$resolution_ref":.github/scripts/temp-upstream-sync-v4.sh > /tmp/upstream-sync-v4.sh

          # v4's first full run proved the merge, tsc, Cargo metadata and 140
          # unit tests; pre-push then found one missing final newline in an
          # upstream-changed file. Add an explicit full-format gate before the
          # commit, and run the two new real-Chromium pan-lock tests through the
          # browser config (plain vitest intentionally excludes *.browser.test).
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/upstream-sync-v4.sh')
          text = path.read_text()
          old = "cargo metadata --locked --format-version 1 --manifest-path apps/readest-app/src-tauri/Cargo.toml --no-deps > /dev/null\n\ngit commit"
          new = """pnpm --filter @readest/readest-app test:browser \\
  src/__tests__/document/fixed-layout-pan-lock.browser.test.ts \\
  src/__tests__/document/pdf-pan-lock.browser.test.ts

python3 <<'FORMATPY'
from pathlib import Path
p = Path('apps/readest-app/src/app/reader/hooks/usePagination.ts')
p.write_text(p.read_text().rstrip('\\n') + '\\n')
FORMATPY
git add -A
pnpm -w format:check
cargo metadata --locked --format-version 1 --manifest-path apps/readest-app/src-tauri/Cargo.toml --no-deps > /dev/null

git commit"""
          if old not in text:
              raise SystemExit('v4 insertion point changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Merge, adapt, browser-test, format-check and publish working branch
        shell: bash
        run: bash /tmp/upstream-sync-v4.sh "${{ steps.refs.outputs.resolution_ref }}"
