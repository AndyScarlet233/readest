name: 临时上游同步合并验证 v4

on:
  push:
    branches:
      - sync-upstream-2026-09-02

permissions:
  contents: write

jobs:
  merge-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch latest upstream and prepare reviewed resolver
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref=6e11bee80323698ab469271b6a2780cb4d8d6bda
          old_upstream_ref=46eca1f3fdaa3c23bf1f683019c0ad5cfbc9ce7f
          git remote add upstream https://github.com/readest/readest.git
          git fetch upstream "$upstream_ref"
          git fetch origin sync-upstream-2026-09-02
          resolution_ref="$(git rev-parse origin/sync-upstream-2026-09-02)"
          echo "resolution_ref=$resolution_ref" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"
          git show "$resolution_ref":.github/scripts/temp-upstream-sync-v4.sh > /tmp/upstream-sync-v4.sh
          sed -i "s/$old_upstream_ref/$upstream_ref/g" /tmp/upstream-sync-v4.sh

          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/upstream-sync-v4.sh')
          text = path.read_text()
          marker = "cargo metadata --locked --format-version 1 --manifest-path apps/readest-app/src-tauri/Cargo.toml --no-deps > /dev/null\n\ngit commit"
          inserted = "\n".join([
              "grep -q 'z-\\[43\\]' apps/readest-app/src/app/reader/components/annotator/AnnotationPopup.tsx",
              "grep -q 'selection-handle' apps/readest-app/src/__tests__/android/helpers/reader.ts",
              "",
              "pnpm exec biome format --write apps/readest-app/src/app/reader/hooks/usePagination.ts",
              "pnpm exec biome format --write apps/readest-app/src/components/settings/IntegrationsPanel.tsx",
              "pnpm exec biome format --write apps/readest-app/src/services/sync/cloudSyncProvider.ts",
              "pnpm exec biome format --write apps/readest-app/src/utils/access.ts",
              "pnpm --filter @readest/readest-app exec playwright install chromium",
              "pnpm --filter @readest/readest-app test:browser \\",
              "  src/__tests__/document/fixed-layout-pan-lock.browser.test.ts \\",
              "  src/__tests__/document/pdf-pan-lock.browser.test.ts",
              "pnpm -w format:check",
              "cargo metadata --locked --format-version 1 --manifest-path apps/readest-app/src-tauri/Cargo.toml --no-deps > /dev/null",
              "",
              "git commit",
          ])
          if marker not in text:
              raise SystemExit('verification insertion point changed unexpectedly')
          path.write_text(text.replace(marker, inserted, 1))
          PY

      - name: Merge, adapt, test and publish working branch
        shell: bash
        run: bash /tmp/upstream-sync-v4.sh "${{ steps.refs.outputs.resolution_ref }}"

      - name: Require latest upstream as merge parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "chore: sync upstream main through 2026-09-03"
          test "$(git rev-parse HEAD^2)" = "${{ steps.refs.outputs.upstream_ref }}"
