name: Android universal test build

on:
  push:
    branches:
      - ci/v0.12.10-build
    paths:
      - '.github/workflows/ci-android-test.yml'

permissions:
  contents: read

jobs:
  android-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          submodules: recursive
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: zulu
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: setup vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: test-android-universal-cargo

      - name: configure test build
        shell: bash
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_POSTHOG_HOST=
          NEXT_PUBLIC_SUPABASE_URL=
          NEXT_PUBLIC_SUPABASE_ANON_KEY=
          NEXT_PUBLIC_APP_PLATFORM=tauri
          SENTRY_DSN=
          SENTRY_AUTH_TOKEN=
          SENTRY_ORG=readest
          SENTRY_PROJECT=readest
          EOF
          cp .env.local apps/readest-app/.env.local

      - name: build Android universal APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          pnpm tauri android build

      - name: collect APK
        shell: bash
        run: |
          mkdir -p test-artifacts
          cp apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk test-artifacts/Readest_0.12.10_universal-test.apk
          ls -lh test-artifacts

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-v0.12.10-android-universal-test
          path: test-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
