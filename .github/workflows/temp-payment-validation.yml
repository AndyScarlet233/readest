name: Temporary payment validation

on:
  push:
    branches:
      - integrate/upstream-account-payment-v2-2026-09-04

permissions:
  contents: write

jobs:
  payment-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout payment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare frontend vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Write deterministic test environment
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
          SENTRY_DSN=
          EOF
          cp .env.local apps/readest-app/.env.local

      - name: Run payment regression tests
        run: |
          pnpm --filter @readest/readest-app exec vitest run \
            src/__tests__/api/google-iap-verify-consume.test.ts \
            src/__tests__/app/api/stripe-plans-route.test.ts \
            src/__tests__/app/api/stripe-portal-flow.test.ts \
            src/__tests__/app/user/plan.test.ts \
            src/__tests__/app/user/plans-comparison.test.tsx \
            src/__tests__/hooks/useQuotaStats-signout.test.ts \
            src/__tests__/libs/payment/apple-iap-app-account-token.test.ts \
            src/__tests__/libs/payment/apple-notifications.test.ts \
            src/__tests__/libs/payment/apple-payment-ownership-race.test.ts \
            src/__tests__/libs/payment/purchased-features.test.ts \
            --maxWorkers=2

      - name: Regenerate Android scaffolding
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init

      - name: Compile and test Google Play billing bridge
        run: |
          cd apps/readest-app/src-tauri/gen/android
          chmod +x ./gradlew
          ./gradlew compileGoogleplayDebugKotlin testGoogleplayDebugUnitTest --stacktrace

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-payment-validation.yml
          git commit -m "chore: remove temporary payment validation workflow"
          git push origin HEAD:integrate/upstream-account-payment-v2-2026-09-04
