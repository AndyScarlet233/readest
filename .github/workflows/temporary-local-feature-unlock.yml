name: Temporary local feature unlock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selective fork unlocks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          access = Path('apps/readest-app/src/utils/access.ts')
          text = access.read_text()
          replacements = {
              'export const CLOUD_SYNC_REQUIRES_PREMIUM = true;': "// Personal fork: third-party sync uses the user's own storage or server, so keep it ungated.\nexport const CLOUD_SYNC_REQUIRES_PREMIUM = false;",
              'export const TTS_CACHE_REQUIRES_PREMIUM = true;': '// Personal fork: offline TTS downloads are stored on the local device, so keep them ungated.\nexport const TTS_CACHE_REQUIRES_PREMIUM = false;',
              'export const NEARBY_PAIRING_REQUIRES_PREMIUM = true;': '// Personal fork: Nearby pairing stays entirely on the local network, so keep it ungated.\nexport const NEARBY_PAIRING_REQUIRES_PREMIUM = false;',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'access.ts replacement count for {old!r}: {count}')
              text = text.replace(old, new)
          access.write_text(text)

          cloud = Path('apps/readest-app/src/__tests__/components/settings/cloudSync.test.ts')
          text = cloud.read_text()
          old = """describe('isCloudSyncAllowed (premium paywall)', () => {
            test('third-party cloud sync requires a paid plan', () => {
              expect(CLOUD_SYNC_REQUIRES_PREMIUM).toBe(true);
              expect(isCloudSyncAllowed('free', false)).toBe(false);
              expect(isCloudSyncAllowed('plus', false)).toBe(true);
              expect(isCloudSyncAllowed('pro', false)).toBe(true);
              expect(isCloudSyncAllowed('purchase', false)).toBe(false);
            });
          });"""
          new = """describe('isCloudSyncAllowed (fork local-resource policy)', () => {
            test('third-party cloud sync is available on every plan', () => {
              expect(CLOUD_SYNC_REQUIRES_PREMIUM).toBe(false);
              expect(isCloudSyncAllowed('free', false)).toBe(true);
              expect(isCloudSyncAllowed('plus', false)).toBe(true);
              expect(isCloudSyncAllowed('pro', false)).toBe(true);
              expect(isCloudSyncAllowed('purchase', false)).toBe(true);
            });
          });"""
          if text.count(old) != 1:
              raise SystemExit('cloudSync premium block did not match exactly')
          text = text.replace(old, new)
          old = """  test('does not entitle a storage-only buyer after the grace period', () => {
            expect(isCloudSyncAllowed('purchase', false)).toBe(false);
          });"""
          new = """  test('fork unlock also entitles a storage-only buyer for third-party sync', () => {
            expect(isCloudSyncAllowed('purchase', false)).toBe(true);
          });"""
          if text.count(old) != 1:
              raise SystemExit('cloudSync storage-only assertion did not match exactly')
          cloud.write_text(text.replace(old, new))

          tts = Path('apps/readest-app/src/__tests__/utils/tts-cache-plan-gate.test.ts')
          text = tts.read_text()
          old = """describe('isTTSCacheAllowed (premium paywall)', () => {
            test('downloading TTS audio for offline playback requires a paid plan', () => {
              expect(TTS_CACHE_REQUIRES_PREMIUM).toBe(true);
              expect(isTTSCacheAllowed('free', false)).toBe(false);
              expect(isTTSCacheAllowed('plus', false)).toBe(true);
              expect(isTTSCacheAllowed('pro', false)).toBe(true);
              expect(isTTSCacheAllowed('purchase', false)).toBe(false);
            });
          });"""
          new = """describe('isTTSCacheAllowed (fork local-resource policy)', () => {
            test('downloading TTS audio for offline playback is available on every plan', () => {
              expect(TTS_CACHE_REQUIRES_PREMIUM).toBe(false);
              expect(isTTSCacheAllowed('free', false)).toBe(true);
              expect(isTTSCacheAllowed('plus', false)).toBe(true);
              expect(isTTSCacheAllowed('pro', false)).toBe(true);
              expect(isTTSCacheAllowed('purchase', false)).toBe(true);
            });
          });"""
          if text.count(old) != 1:
              raise SystemExit('TTS premium block did not match exactly')
          text = text.replace(old, new)
          old = """  test('does not entitle a storage-only buyer after the grace period', () => {
            expect(isTTSCacheAllowed('purchase', false)).toBe(false);
          });"""
          new = """  test('fork unlock also entitles a storage-only buyer for local TTS cache', () => {
            expect(isTTSCacheAllowed('purchase', false)).toBe(true);
          });"""
          if text.count(old) != 1:
              raise SystemExit('TTS storage-only assertion did not match exactly')
          tts.write_text(text.replace(old, new))

          nearby = Path('apps/readest-app/src/__tests__/utils/nearby-pairing-plan-gate.test.ts')
          text = nearby.read_text()
          old = """describe('isNearbyPairingAllowed (premium paywall)', () => {
            test('pairing for confirmation-free drops requires a paid plan', () => {
              expect(NEARBY_PAIRING_REQUIRES_PREMIUM).toBe(true);
              expect(isNearbyPairingAllowed('free', false)).toBe(false);
              expect(isNearbyPairingAllowed('plus', false)).toBe(true);
              expect(isNearbyPairingAllowed('pro', false)).toBe(true);
              expect(isNearbyPairingAllowed('purchase', false)).toBe(false);
            });

            test('the Full Customization unlock entitles a free user', () => {
              expect(isNearbyPairingAllowed('free', true)).toBe(true);
              expect(isNearbyPairingAllowed('purchase', true)).toBe(true);
            });
          });"""
          new = """describe('isNearbyPairingAllowed (fork local-resource policy)', () => {
            test('confirmation-free local pairing is available on every plan', () => {
              expect(NEARBY_PAIRING_REQUIRES_PREMIUM).toBe(false);
              expect(isNearbyPairingAllowed('free', false)).toBe(true);
              expect(isNearbyPairingAllowed('plus', false)).toBe(true);
              expect(isNearbyPairingAllowed('pro', false)).toBe(true);
              expect(isNearbyPairingAllowed('purchase', false)).toBe(true);
            });

            test('the Full Customization unlock remains compatible', () => {
              expect(isNearbyPairingAllowed('free', true)).toBe(true);
              expect(isNearbyPairingAllowed('purchase', true)).toBe(true);
            });
          });"""
          if text.count(old) != 1:
              raise SystemExit('Nearby premium block did not match exactly')
          nearby.write_text(text.replace(old, new))

          boundary = Path('apps/readest-app/src/__tests__/utils/fork-local-unlock-boundary.test.ts')
          boundary.write_text("""import { describe, expect, test } from 'vitest';

import {
  isCloudSyncAllowed,
  isCustomizationAllowed,
  isEmailInPlan,
  isNearbyPairingAllowed,
  isTTSCacheAllowed,
} from '@/utils/access';

describe('fork local feature unlock boundary', () => {
  test('unlocks only client-side or user-owned-resource premium features', () => {
    expect(isCloudSyncAllowed('free', false)).toBe(true);
    expect(isTTSCacheAllowed('free', false)).toBe(true);
    expect(isNearbyPairingAllowed('free', false)).toBe(true);
  });

  test('does not globally forge premium entitlement or unlock server-backed email-in', () => {
    expect(isCustomizationAllowed('free', false)).toBe(false);
    expect(isEmailInPlan('free', false)).toBe(false);
  });
});
""")
          PY

          git diff --check
          git diff -- apps/readest-app/src/utils/access.ts \
            apps/readest-app/src/__tests__/components/settings/cloudSync.test.ts \
            apps/readest-app/src/__tests__/utils/tts-cache-plan-gate.test.ts \
            apps/readest-app/src/__tests__/utils/nearby-pairing-plan-gate.test.ts \
            apps/readest-app/src/__tests__/utils/fork-local-unlock-boundary.test.ts

      - name: Commit selective unlocks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/readest-app/src/utils/access.ts \
            apps/readest-app/src/__tests__/components/settings/cloudSync.test.ts \
            apps/readest-app/src/__tests__/utils/tts-cache-plan-gate.test.ts \
            apps/readest-app/src/__tests__/utils/nearby-pairing-plan-gate.test.ts \
            apps/readest-app/src/__tests__/utils/fork-local-unlock-boundary.test.ts
          git commit -m 'feat: unlock local and user-owned premium features'
          git push origin HEAD:main
