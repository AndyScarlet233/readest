name: One-shot large book download hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-large-book-download.yml

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    name: 修复大体积书籍下载并启动发布
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: apply large-book resumable download hotfix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          rust = 'apps/readest-app/src-tauri/src/transfer_file.rs'
          storage = 'apps/readest-app/src/libs/storage.ts'
          webdav = 'apps/readest-app/src/services/sync/providers/webdav/WebDAVProvider.ts'
          gdrive = 'apps/readest-app/src/services/sync/providers/gdrive/GoogleDriveProvider.ts'
          onedrive = 'apps/readest-app/src/services/sync/providers/onedrive/OneDriveProvider.ts'
          s3 = 'apps/readest-app/src/services/sync/providers/s3/S3Provider.ts'

          replace_once(
              rust,
              'const MAX_DOWNLOAD_BYTES: u64 = 2 * 1024 * 1024 * 1024;',
              '\n'.join([
                  '// Native downloads stream to disk, so the old 2 GiB ceiling rejected valid large',
                  '// AZW3/PDF/CBZ files even though neither reqwest nor the filesystem needs them in RAM.',
                  '// Keep a finite sanity limit, but leave enough headroom for omnibus/reference books.',
                  'const MAX_DOWNLOAD_BYTES: u64 = 16 * 1024 * 1024 * 1024;',
              ]),
          )

          replace_once(
              storage,
              '\n'.join(['        skipSslVerification,', '      );']),
              '\n'.join(['        skipSslVerification,', '        { resume: true },', '      );']),
          )

          replace_once(
              webdav,
              '\n'.join([
                  '        await tauriDownload(url, localPath, onProgress, authHeaders());',
                  '        return true;',
                  '      } catch (e) {',
                  "        console.warn('WebDAVProvider.downloadStream failed', remotePath, e);",
                  '        return false;',
                  '      }',
              ]),
              '\n'.join([
                  '        await tauriDownload(',
                  '          url,',
                  '          localPath,',
                  '          onProgress,',
                  '          authHeaders(),',
                  '          undefined,',
                  '          undefined,',
                  '          undefined,',
                  '          { resume: true },',
                  '        );',
                  '        return true;',
                  '      } catch (e) {',
                  "        console.warn('WebDAVProvider.downloadStream failed', remotePath, e);",
                  '        throw mapError(e);',
                  '      }',
              ]),
          )

          replace_once(
              gdrive,
              '\n'.join([
                  '      await tauriDownload(mediaDownloadUrl(fileId), localPath, onProgress, {',
                  '        Authorization: `Bearer ${token}`,',
                  '      });',
                  '      return true;',
                  '    } catch (e) {',
                  "      console.warn('GoogleDriveProvider.downloadStream failed', remotePath, e);",
                  '      return false;',
                  '    }',
              ]),
              '\n'.join([
                  '      await tauriDownload(',
                  '        mediaDownloadUrl(fileId),',
                  '        localPath,',
                  '        onProgress,',
                  '        { Authorization: `Bearer ${token}` },',
                  '        undefined,',
                  '        undefined,',
                  '        undefined,',
                  '        { resume: true },',
                  '      );',
                  '      return true;',
                  '    } catch (e) {',
                  "      console.warn('GoogleDriveProvider.downloadStream failed', remotePath, e);",
                  '      throw mapDriveError(e);',
                  '    }',
              ]),
          )

          replace_once(
              onedrive,
              '\n'.join([
                  '      await tauriDownload(contentUrl(remotePath), localPath, onProgress, {',
                  '        Authorization: `Bearer ${token}`,',
                  '      });',
                  '      return true;',
                  '    } catch (e) {',
                  "      console.warn('OneDriveProvider.downloadStream failed', remotePath, e);",
                  '      return false;',
                  '    }',
              ]),
              '\n'.join([
                  '      await tauriDownload(',
                  '        contentUrl(remotePath),',
                  '        localPath,',
                  '        onProgress,',
                  '        { Authorization: `Bearer ${token}` },',
                  '        undefined,',
                  '        undefined,',
                  '        undefined,',
                  '        { resume: true },',
                  '      );',
                  '      return true;',
                  '    } catch (e) {',
                  "      console.warn('OneDriveProvider.downloadStream failed', remotePath, e);",
                  '      throw mapGraphError(e);',
                  '    }',
              ]),
          )

          replace_once(
              s3,
              '\n'.join([
                  '      await tauriDownload(url, localPath, onProgress);',
                  '      return true;',
                  '    } catch (e) {',
                  "      console.warn('S3Provider.downloadStream failed', remotePath, e);",
                  '      return false;',
                  '    }',
              ]),
              '\n'.join([
                  '      await tauriDownload(',
                  '        url,',
                  '        localPath,',
                  '        onProgress,',
                  '        undefined,',
                  '        undefined,',
                  '        undefined,',
                  '        undefined,',
                  '        { resume: true },',
                  '      );',
                  '      return true;',
                  '    } catch (e) {',
                  "      console.warn('S3Provider.downloadStream failed', remotePath, e);",
                  '      throw mapS3Error(e);',
                  '    }',
              ]),
          )
          PY

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: large-book-download-hotfix

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: format changed files
        shell: bash
        run: |
          pnpm --filter @readest/readest-app exec biome format --write \
            src/libs/storage.ts \
            src/services/sync/providers/webdav/WebDAVProvider.ts \
            src/services/sync/providers/gdrive/GoogleDriveProvider.ts \
            src/services/sync/providers/onedrive/OneDriveProvider.ts \
            src/services/sync/providers/s3/S3Provider.ts
          cargo fmt --manifest-path apps/readest-app/src-tauri/Cargo.toml

      - name: verify repository formatting
        run: pnpm -w format:check

      - name: verify large-book transfer wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const MAX_DOWNLOAD_BYTES: u64 = 16 \* 1024 \* 1024 \* 1024;' apps/readest-app/src-tauri/src/transfer_file.rs
          count="$(grep -R "resume: true" \
            apps/readest-app/src/libs/storage.ts \
            apps/readest-app/src/services/sync/providers/webdav/WebDAVProvider.ts \
            apps/readest-app/src/services/sync/providers/gdrive/GoogleDriveProvider.ts \
            apps/readest-app/src/services/sync/providers/onedrive/OneDriveProvider.ts \
            apps/readest-app/src/services/sync/providers/s3/S3Provider.ts | wc -l)"
          test "$count" -ge 5
          grep -q 'throw mapError(e);' apps/readest-app/src/services/sync/providers/webdav/WebDAVProvider.ts
          grep -q 'throw mapDriveError(e);' apps/readest-app/src/services/sync/providers/gdrive/GoogleDriveProvider.ts
          grep -q 'throw mapGraphError(e);' apps/readest-app/src/services/sync/providers/onedrive/OneDriveProvider.ts
          grep -q 'throw mapS3Error(e);' apps/readest-app/src/services/sync/providers/s3/S3Provider.ts

      - name: check native transfer code
        run: cargo check --manifest-path apps/readest-app/src-tauri/Cargo.toml --lib

      - name: prepare frontend vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: typecheck frontend
        run: pnpm --filter @readest/readest-app exec tsc --noEmit

      - name: commit verified hotfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-large-book-download.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sync): resume multi-gigabyte book downloads'
          HUSKY=0 git push origin HEAD:main

      - name: dispatch formal v0.12.6.21 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v0.12.6.21
