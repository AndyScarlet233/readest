name: Temporary upstream annotator cherry-pick

on:
  push:
    branches:
      - integrate/upstream-annotator-one-tap-2026-09-03
    paths:
      - .github/workflows/temp-upstream-annotator-cherry-pick.yml

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Cherry-pick and preserve fork annotator changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-tags upstream 87bba1369bec09731f023c8c45dcdf0dd4e5511e 88ea2de55f10769207a8388d931bd84ea1df4ee6

          git cherry-pick 87bba1369bec09731f023c8c45dcdf0dd4e5511e

          if ! git cherry-pick 88ea2de55f10769207a8388d931bd84ea1df4ee6; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'apps/readest-app/e2e/tests/annotation.spec.ts\napps/readest-app/src/app/reader/components/annotator/AnnotationPopup.tsx'
            if [[ "$conflicts" != "$expected" ]]; then
              echo "Unexpected conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi

            git checkout --conflict=merge -- apps/readest-app/e2e/tests/annotation.spec.ts
            git checkout --conflict=merge -- apps/readest-app/src/app/reader/components/annotator/AnnotationPopup.tsx

            python - <<'PY'
          from pathlib import Path

          spec = Path('apps/readest-app/e2e/tests/annotation.spec.ts')
          text = spec.read_text()
          start = text.index('<<<<<<< ours\n')
          sep = text.index('=======\n', start)
          end = text.index('>>>>>>> theirs\n', sep)
          ours = text[start + len('<<<<<<< ours\n'):sep]
          theirs = text[sep + len('=======\n'):end]
          if ours.strip():
              raise SystemExit('annotation.spec conflict unexpectedly has non-empty fork side')
          text = text[:start] + theirs + text[end + len('>>>>>>> theirs\n'):]
          if '<<<<<<<' in text or '>>>>>>>' in text or '\n=======\n' in text:
              raise SystemExit('annotation.spec still contains conflict markers')
          spec.write_text(text)

          popup = Path('apps/readest-app/src/app/reader/components/annotator/AnnotationPopup.tsx')
          text = popup.read_text()
          start = text.index('<<<<<<< ours\n')
          sep = text.index('=======\n', start)
          end = text.index('>>>>>>> theirs\n', sep)
          ours = text[start + len('<<<<<<< ours\n'):sep]
          theirs = text[sep + len('=======\n'):end]
          if "notes.length > 0 && 'bg-transparent'" not in ours:
              raise SystemExit('fork AnnotationPopup conflict changed unexpectedly')
          if 'pointer-events-auto' not in theirs or 'noteEditor' not in theirs:
              raise SystemExit('upstream AnnotationPopup conflict changed unexpectedly')
          merged = "        className={clsx('selection-popup pointer-events-auto', notes.length > 0 && 'bg-transparent')}\n"
          text = text[:start] + merged + text[end + len('>>>>>>> theirs\n'):]
          if 'noteEditor' in text:
              raise SystemExit('upstream-only noteEditor leaked into fork AnnotationPopup')
          if '<<<<<<<' in text or '>>>>>>>' in text or '\n=======\n' in text:
              raise SystemExit('AnnotationPopup still contains conflict markers')
          popup.write_text(text)
          PY

            git add apps/readest-app/e2e/tests/annotation.spec.ts \
              apps/readest-app/src/app/reader/components/annotator/AnnotationPopup.tsx \
              apps/readest-app/src/__tests__/android/helpers/reader.ts \
              apps/readest-app/src/__tests__/android/selection.android.test.ts
            GIT_EDITOR=true git cherry-pick --continue
          fi

          git diff --check HEAD~2..HEAD
          git push origin HEAD:integrate/upstream-annotator-one-tap-2026-09-03
