name: Temporary start fork release

on:
  push:
    paths:
      - '.github/workflows/temporary-start-fork-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Create release and start official release workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v0.12.8-fork.1';
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: 'main',
                name: 'Readest 0.12.8-fork.1',
                body: '基于官方 Readest 0.12.8 的 fork 主线版本。解除第三方同步、TTS 离线缓存与 Nearby BookDrop 配对等不依赖官方服务器资源的 Premium 限制；Readest Cloud 存储、服务器翻译额度与 Send to Readest 邮件等官方云端资源保持原规则。',
                draft: false,
                prerelease: false
              })).data;
            }
            core.info(`Release ready: ${release.html_url}`);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'release.yml',
              ref: 'main'
            });
            core.info('Release workflow dispatched.');
