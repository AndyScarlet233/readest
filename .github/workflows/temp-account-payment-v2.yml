name: Temporary account/payment integration

on:
  push:
    branches:
      - integrate/upstream-account-payment-v2-2026-09-04

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Replay reviewed payment integration on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commits=(
            9e51f4df5e68e3077dce48f54ea49a43b254ec39
            874df7063159d1bcfba482ee886cf3c6cf5e1616
            7653c8b80467318eae0bce341e2f4175df66600d
            36370c740572a7e781d39026e0aba631550ffd07
            52c29897f24ecc526f530a87999ddeaacb6ec321
            7a1c56af1fba3a320e71a98413bebc21dfaf9dc7
          )
          quota_hook="apps/readest-app/src/hooks/useQuotaStats.ts"
          access_file="apps/readest-app/src/utils/access.ts"
          for commit in "${commits[@]}"; do
            if git cherry-pick "$commit"; then
              continue
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "$commit" == "9e51f4df5e68e3077dce48f54ea49a43b254ec39" && "${#conflicts[@]}" -eq 1 && "${conflicts[0]}" == "$quota_hook" ]]; then
              # Expected overlap with #38. The payment-series hook fixes stale
              # account/sign-out entitlement state; later commits remove its
              # temporary customization sync-cache coupling.
              git checkout --theirs -- "$quota_hook"
              git add "$quota_hook"
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi

            if [[ "$commit" == "7653c8b80467318eae0bce341e2f4175df66600d" && "${#conflicts[@]}" -eq 1 && "${conflicts[0]}" == "$access_file" ]]; then
              # Current main already exposes customization_purchased and is a
              # strict superset of this old commit: it also retains FORK_UNLOCK,
              # Nearby pairing gates from #38, and optional-claim compatibility.
              # Preserve current-main access semantics rather than regressing
              # those fork customizations.
              git checkout --ours -- "$access_file"
              git add "$access_file"
              if git diff --cached --quiet; then
                git cherry-pick --skip
              else
                GIT_EDITOR=true git cherry-pick --continue
              fi
              continue
            fi

            echo "::error::Unexpected cherry-pick conflict at $commit. Refusing automatic resolution."
            printf 'Conflicted paths:\n%s\n' "${conflicts[*]}"
            git status --short
            git cherry-pick --abort
            exit 1
          done

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-account-payment-v2.yml
          git commit -m "chore: remove temporary integration workflow"
          git push origin HEAD:integrate/upstream-account-payment-v2-2026-09-04
