name: One-shot CBZ pan hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-cbz-pan-hotfix.yml

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    name: 修复编译门禁并启动正式发布
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: apply fixed-layout mouse pan hotfix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1))

          pagination = 'apps/readest-app/src/app/reader/hooks/usePagination.ts'
          iframe = 'apps/readest-app/src/app/reader/utils/iframeEventHandlers.ts'
          test = 'apps/readest-app/src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts'

          replace_once(
              pagination,
              """export const hasHorizontalPanning = (\n  view: FoliateView | null,\n  viewSettings: ViewSettings | null | undefined,\n) => {\n  if (!view || !viewSettings) return false;\n  return (\n    isPanningView(view, viewSettings) &&\n    typeof view.isOverflowX === 'function' &&\n    view.isOverflowX()\n  );\n};\n\nexport const hasVerticalPanning = (\n  view: FoliateView | null,\n  viewSettings: ViewSettings | null | undefined,\n) => {\n  if (!view || !viewSettings) return false;\n  return isPanningView(view, viewSettings) && view.isOverflowY();\n};""",
              """export const hasHorizontalPanning = (\n  view: FoliateView | null,\n  viewSettings: ViewSettings | null | undefined,\n) => {\n  if (!view || !viewSettings) return false;\n  return (\n    view.book?.rendition?.layout === 'pre-paginated' &&\n    !viewSettings.scrolled &&\n    typeof view.isOverflowX === 'function' &&\n    view.isOverflowX()\n  );\n};\n\nexport const hasVerticalPanning = (\n  view: FoliateView | null,\n  viewSettings: ViewSettings | null | undefined,\n) => {\n  if (!view || !viewSettings) return false;\n  return (\n    view.book?.rendition?.layout === 'pre-paginated' &&\n    !viewSettings.scrolled &&\n    typeof view.isOverflowY === 'function' &&\n    view.isOverflowY()\n  );\n};""",
          )

          replace_once(
              pagination,
              """    setMousePanArmed(\n      bookKey,\n      Boolean(data?.isFixedLayout && !settings?.scrolled && (horizontal || vertical)),\n      { horizontal, vertical },\n    );""",
              """    // Track the whole primary-button lifetime for fixed-layout pages. Overflow can\n    // change after resize/zoom, so it must not be a hard gate for starting a drag.\n    setMousePanArmed(bookKey, Boolean(data?.isFixedLayout && !settings?.scrolled), {\n      horizontal,\n      vertical,\n    });""",
          )

          replace_once(
              pagination,
              """        const canPan = Boolean(\n          data?.isFixedLayout &&\n            !settings?.scrolled &&\n            isPanningView(view, settings) &&\n            (hasHorizontalPanning(view, settings) || hasVerticalPanning(view, settings)),\n        );\n        const canTrack = canPan && event.button === 0 && !event.hasTextSelection;\n        const horizontal = hasHorizontalPanning(view, settings);\n        const vertical = hasVerticalPanning(view, settings);\n        setMousePanArmed(bookKey, canTrack, { horizontal, vertical });\n        if (!canTrack) return false;\n        if ((!horizontal && !vertical) || event.screenX == null || event.screenY == null)\n          return false;""",
              """        const canTrack = Boolean(\n          data?.isFixedLayout &&\n            !settings?.scrolled &&\n            event.button === 0 &&\n            !event.hasTextSelection,\n        );\n        const horizontal = hasHorizontalPanning(view, settings);\n        const vertical = hasVerticalPanning(view, settings);\n        setMousePanArmed(bookKey, canTrack, { horizontal, vertical });\n        if (!canTrack || event.screenX == null || event.screenY == null) return false;""",
          )

          replace_once(
              pagination,
              """      if (\n        !data?.isFixedLayout ||\n        settings?.scrolled ||\n        !isPanningView(view, settings) ||\n        (!horizontalPan && !verticalPan)\n      ) {\n        mousePanRef.current = null;\n        setMousePanClaimed(bookKey, false);\n        return false;\n      }\n      if (event.screenX == null || event.screenY == null) return false;""",
              """      if (!data?.isFixedLayout || settings?.scrolled) {\n        mousePanRef.current = null;\n        setMousePanArmed(bookKey, false);\n        setMousePanClaimed(bookKey, false);\n        return false;\n      }\n      // Keep the session alive while layout catches up. Once overflow appears, the\n      // same held-button gesture can claim and pan without requiring another click.\n      setMousePanArmed(bookKey, true, { horizontal: horizontalPan, vertical: verticalPan });\n      if (!horizontalPan && !verticalPan) return false;\n      if (event.screenX == null || event.screenY == null) return false;""",
          )

          replace_once(
              iframe,
              """  return axes.horizontal || axes.vertical ? axes : null;""",
              """  // A fixed-layout page with no overflow yet is still eligible for a drag\n  // session: resize/zoom can expose an axis while the primary button is held.\n  return axes;""",
          )

          marker = """  test('ends a claimed drag when a move reports no buttons', () => {"""
          regression = """  test('keeps a fixed-layout drag alive until overflow becomes available', () => {\n    let overflowX = false;\n    const view = makeView(false, false);\n    view.isOverflowX = () => overflowX;\n    mocks.getViewSettings.mockReturnValue({\n      scrolled: false,\n      zoomLevel: 100,\n      zoomMode: 'fit-page',\n    });\n    const h = renderHook(() =>\n      usePagination('book-1', { current: view as unknown as FoliateView }, { current: null }),\n    );\n\n    expect(h.result.current.handleMousePan(point(100, 100))).toBe(false);\n    overflowX = true;\n    expect(\n      h.result.current.handleMousePan({\n        type: 'mousemove',\n        bookKey: 'book-1',\n        buttons: 1,\n        screenX: 120,\n        screenY: 100,\n      }),\n    ).toBe(true);\n    expect(view.pan).toHaveBeenCalledWith(-20, 0);\n  });\n\n"""
          replace_once(test, marker, regression + marker)
          PY

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: fix repository formatting gate
        run: |
          pnpm exec biome format --write \
            apps/readest-app/src/components/settings/integrations/FileSyncForm.tsx \
            apps/readest-app/src/components/stats/BookRankingList.tsx \
            apps/readest-app/src/components/stats/DailyBarChart.tsx \
            apps/readest-app/src/components/stats/StatsDialog.tsx \
            apps/readest-app/src/services/sync/file/provider.ts \
            apps/readest-app/src/services/sync/providers/lan/LanSyncProvider.ts \
            apps/readest-app/src/app/reader/hooks/usePagination.ts \
            apps/readest-app/src/app/reader/utils/iframeEventHandlers.ts \
            apps/readest-app/src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts

      - name: verify formatting
        run: pnpm -w format:check

      - name: run CBZ mouse-pan regression test
        timeout-minutes: 3
        run: pnpm --filter @readest/readest-app exec dotenv -e .env -- vitest run src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts

      - name: prepare frontend vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: typecheck frontend
        run: pnpm --filter @readest/readest-app exec tsc --noEmit

      - name: commit fixes and remove one-shot workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-cbz-pan-hotfix.yml
          git add -A
          git commit -m 'fix: restore reader drag and unblock release builds'
          HUSKY=0 git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: dispatch formal v0.12.6.19 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag=v0.12.6.19
          echo "Dispatched formal release workflow for v0.12.6.19 from ${{ steps.commit.outputs.sha }}"
