name: Temporary fork.2 sanitize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-fork2-sanitize.yml'
permissions:
  contents: write
jobs:
  sanitize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: 'true'
          fetch-depth: 0
      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: restore official package manifest and harden large uploads
        run: |
          git remote add upstream https://github.com/readest/readest.git || true
          git fetch --depth=1 upstream tag v0.12.8
          git show FETCH_HEAD:apps/readest-app/package.json > /tmp/package.json
          sed -i 's/"version": "0.12.6"/"version": "0.12.8-fork.2"/' /tmp/package.json
          cp /tmp/package.json apps/readest-app/package.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/readest-app/src-tauri/src/transfer_file.rs')
          s = p.read_text()
          s = s.replace('use read_progress_stream::ReadProgressStream;\n\n', '')
          start = s.index('fn file_to_body(')
          end = s.index('\n#[cfg(test)]', start)
          replacement = '''fn file_to_body(channel: Channel<ProgressPayload>, file: File, file_len: u64) -> reqwest::Body {
              let mut stats = TransferStats::default();
              let stream = FramedRead::new(file, BytesCodec::new()).map_ok(move |chunk| {
                  let bytes = chunk.freeze();
                  stats.record_chunk_transfer(bytes.len());
                  let _ = channel.send(ProgressPayload {
                      progress: stats.total_transferred,
                      total: file_len,
                      transfer_speed: stats.transfer_speed,
                  });
                  bytes
              });
              reqwest::Body::wrap_stream(stream)
          }
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          git diff --check
          cmp -s /tmp/package.json apps/readest-app/package.json
      - name: verify frozen lockfile
        working-directory: apps/readest-app
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: rust format check
        working-directory: apps/readest-app/src-tauri
        run: cargo fmt --check
      - name: rust clippy
        working-directory: apps/readest-app/src-tauri
        run: cargo clippy -p Readest --no-deps -- -D warnings
      - name: rust unit tests
        working-directory: apps/readest-app/src-tauri
        run: cargo test -p Readest --lib
      - name: commit validated fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/readest-app/package.json apps/readest-app/src-tauri/src/transfer_file.rs
          git commit -m 'fix(sync): harden large native transfers and restore manifest'
          git push origin HEAD:main
