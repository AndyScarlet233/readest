name: Temporary branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.repository == 'AndyScarlet233/readest' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all branches except main and develop
        shell: bash
        run: |
          git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | while read -r branch; do
            case "$branch" in
              main|develop) continue ;;
            esac
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done
