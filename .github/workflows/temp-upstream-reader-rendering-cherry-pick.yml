name: Temporary upstream reader rendering cherry-pick

on:
  push:
    branches:
      - integrate/upstream-reader-rendering-2026-09-03
    paths:
      - .github/workflows/temp-upstream-reader-rendering-cherry-pick.yml

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Inspect upstream rendering cherry-picks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-tags upstream 63fb3230eefc8a8d0b2e289bed53ba66fb921433 36d0fa2dd3db9fec2ab214ae29cef9ff2d041136 26a4bcaf00091ecb74c53545af6ced0c18f22553
          for sha in 63fb3230eefc8a8d0b2e289bed53ba66fb921433 36d0fa2dd3db9fec2ab214ae29cef9ff2d041136 26a4bcaf00091ecb74c53545af6ced0c18f22553; do
            if ! git cherry-pick "$sha"; then
              echo "::group::Conflicts for $sha"
              git status --short
              git diff --name-only --diff-filter=U
              for file in $(git diff --name-only --diff-filter=U); do
                echo "===== $file ====="
                git checkout --conflict=merge -- "$file" || true
                sed -n '1,360p' "$file" || true
              done
              echo '::endgroup::'
              exit 1
            fi
          done
          git diff --check HEAD~3..HEAD
          git push origin HEAD:integrate/upstream-reader-rendering-2026-09-03
