name: Temporary upstream reader rendering cherry-pick

on:
  push:
    branches:
      - integrate/upstream-reader-rendering-2026-09-03
    paths:
      - .github/workflows/temp-upstream-reader-rendering-cherry-pick.yml

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Cherry-pick rendering fixes while preserving fork changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-tags upstream 63fb3230eefc8a8d0b2e289bed53ba66fb921433 36d0fa2dd3db9fec2ab214ae29cef9ff2d041136 26a4bcaf00091ecb74c53545af6ced0c18f22553

          if ! git cherry-pick 63fb3230eefc8a8d0b2e289bed53ba66fb921433; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'apps/readest-app/public/locales/zh-CN/translation.json\napps/readest-app/public/locales/zh-TW/translation.json\npackages/foliate-js'
            if [[ "$conflicts" != "$expected" ]]; then
              echo "Unexpected #6030 conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi

            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for path in [
              'apps/readest-app/public/locales/zh-CN/translation.json',
              'apps/readest-app/public/locales/zh-TW/translation.json',
          ]:
              ours = json.loads(subprocess.check_output(['git', 'show', f':2:{path}']))
              theirs = json.loads(subprocess.check_output(['git', 'show', f':3:{path}']))
              key = 'Lock Horizontal Panning'
              if key not in theirs:
                  raise SystemExit(f'{path}: upstream key missing')
              if key in ours and ours[key] != theirs[key]:
                  raise SystemExit(f'{path}: fork already has a conflicting translation')
              ours[key] = theirs[key]
              Path(path).write_text(json.dumps(ours, ensure_ascii=False, indent=2) + '\n')
          PY

            git add apps/readest-app/public/locales/zh-CN/translation.json \
              apps/readest-app/public/locales/zh-TW/translation.json
            # The fork gitlink is an older upstream foliate-js commit, not a fork-only
            # submodule branch. Advance it to #6030's reviewed upstream target; #6042
            # below advances the same line again to the canvas fix.
            git update-index --add --cacheinfo 160000,b1fe9d3eb945c6fae7528377d2601c6bf3683835,packages/foliate-js
            GIT_EDITOR=true git cherry-pick --continue
          fi

          for sha in 36d0fa2dd3db9fec2ab214ae29cef9ff2d041136 26a4bcaf00091ecb74c53545af6ced0c18f22553; do
            if ! git cherry-pick "$sha"; then
              echo "Unexpected conflict in $sha" >&2
              git status --short >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          done

          test "$(git ls-tree HEAD packages/foliate-js | awk '{print $3}')" = 'f71a084e609aaaa6c354aab2ee9eff6bf01b587a'
          git diff --check HEAD~3..HEAD
          git push origin HEAD:integrate/upstream-reader-rendering-2026-09-03
