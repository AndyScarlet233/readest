name: Temporary verify Calibre fork

on:
  push:
    paths:
      - '.github/workflows/temporary-verify-calibre-fork.yml'

permissions:
  contents: write

jobs:
  verify-calibre-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test, build and upload Calibre plugin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/readest-app/package.json').version")
          test "$version" = '0.12.8-fork.1'
          make -C apps/readest-calibre-plugin test
          make -C apps/readest-calibre-plugin clean zip
          plugin_zip="apps/readest-calibre-plugin/dist/Readest-${version}.calibre-plugin.zip"
          test -f "$plugin_zip"
          gh release upload "v${version}" "$plugin_zip" --clobber
