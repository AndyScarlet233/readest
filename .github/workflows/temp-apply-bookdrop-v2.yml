name: Temporary integrate Nearby BookDrop v2

on:
  push:
    branches:
      - integrate/upstream-nearby-bookdrop-v2-2026-09-04
    paths:
      - .github/workflows/temp-apply-bookdrop-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply BookDrop v2, iOS recovery, and KOReader goodbye fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git

          c6023='5a3ab1b47a8ae0ddfb31b0abaec8f38ef2191ce6'
          p6023='7413386ceef8b556434e9f3eee8761398dd8d1d7'
          c6049='9c235ed8f9dfd56a063b18a190cf77ece908ce9c'
          p6049='8db365510af17eb4b830fe33b4b46ece8ade103a'
          c6050='049ed2cda634d94c5df8797218a63f92799777a4'
          git fetch --no-tags upstream "$c6023" "$p6023" "$c6049" "$p6049" "$c6050"

          apply_locale_delta() {
            COMMIT="$1" PARENT="$2" python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          commit = os.environ['COMMIT']
          parent = os.environ['PARENT']
          for path in Path('apps/readest-app/public/locales').glob('*/translation.json'):
              rel = path.as_posix()
              try:
                  before = json.loads(subprocess.check_output(['git', 'show', f'{parent}:{rel}'], text=True))
                  after = json.loads(subprocess.check_output(['git', 'show', f'{commit}:{rel}'], text=True))
              except subprocess.CalledProcessError:
                  continue
              ours = json.loads(path.read_text())
              changed = False
              for key, value in after.items():
                  if key not in before or before.get(key) != value:
                      if ours.get(key) != value:
                          ours[key] = value
                          changed = True
              for key, old_value in before.items():
                  if key not in after and ours.get(key) == old_value:
                      del ours[key]
                      changed = True
              if changed:
                  path.write_text(json.dumps(ours, ensure_ascii=False, indent=2) + '\n')
          PY
          }

          patch_fork_bookdrop_glue() {
            python - <<'PY'
          from pathlib import Path

          # Preserve the fork's full Integrations panel (LAN Sync, S3/iCloud,
          # FORK_UNLOCK-aware cloud rows) and add only upstream's BookDrop alias status.
          p = Path('apps/readest-app/src/components/settings/IntegrationsPanel.tsx')
          s = p.read_text()
          if "import { useLocalSendStore } from '@/store/localsendStore';" not in s:
              s = s.replace(
                  "import { useFileSyncStore } from '@/store/fileSyncStore';\n",
                  "import { useFileSyncStore } from '@/store/fileSyncStore';\nimport { useLocalSendStore } from '@/store/localsendStore';\n",
              )
          s = s.replace(
              "import { isLocalSendEnabled } from '@/services/localsend/devicePrefs';",
              "import { getLocalSendAlias, isLocalSendEnabled } from '@/services/localsend/devicePrefs';",
          )
          anchor = "  const absCount = absServers.filter((s) => !s.deletedAt).length;\n"
          if 'const localSendAlias = useLocalSendStore' not in s:
              if anchor not in s:
                  raise SystemExit('IntegrationsPanel absCount anchor not found')
              s = s.replace(anchor, anchor + "  const localSendAlias = useLocalSendStore((s) => s.status?.alias);\n")
          anchor = "  const absStatus = absCount > 0 ? _('{{count}} server', { count: absCount }) : _('No servers');\n"
          if 'const localSendStatus =' not in s:
              if anchor not in s:
                  raise SystemExit('IntegrationsPanel absStatus anchor not found')
              s = s.replace(
                  anchor,
                  anchor + "  const localSendStatus = !isLocalSendEnabled()\n    ? _('Off')\n    : localSendAlias || getLocalSendAlias() || _('On');\n",
              )
          s = s.replace("status={isLocalSendEnabled() ? _('On') : _('Off')}", 'status={localSendStatus}')
          p.write_text(s)

          # Preserve the fork's client-side unlocks; add only the token claim and
          # Nearby pairing gate needed by BookDrop. FORK_UNLOCK keeps LAN pairing
          # available in this community build.
          p = Path('apps/readest-app/src/utils/access.ts')
          s = p.read_text()
          if 'customization_purchased' not in s:
              s = s.replace(
                  "  storage_purchased_bytes: number;\n  [key: string]: string | number;",
                  "  storage_purchased_bytes: number;\n  customization_purchased?: boolean;\n  [key: string]: string | number | boolean | undefined;",
              )
          block = '''\n/** Nearby BookDrop pairing stays client-side and is unlocked in this fork. */\nexport const NEARBY_PAIRING_PLANS: readonly UserPlan[] = ['plus', 'pro', 'purchase'];\n\nexport const isNearbyPairingInPlan = (\n  plan: UserPlan,\n  customizationPurchased = false,\n): boolean => customizationPurchased || plan === 'plus' || plan === 'pro';\n\nexport const NEARBY_PAIRING_REQUIRES_PREMIUM = true;\n\nexport const isNearbyPairingAllowed = (\n  plan: UserPlan,\n  customizationPurchased = false,\n): boolean =>\n  FORK_UNLOCK ||\n  !NEARBY_PAIRING_REQUIRES_PREMIUM ||\n  isNearbyPairingInPlan(plan, customizationPurchased);\n\nexport const getCustomizationPurchased = (token: string): boolean => {\n  const data = jwtDecode<Token>(token) || {};\n  return data['customization_purchased'] === true;\n};\n'''
          if 'export const isNearbyPairingAllowed' not in s:
              marker = 'export const STORAGE_QUOTA_GRACE_BYTES = 10 * 1024 * 1024; // 10 MB grace\n'
              if marker not in s:
                  raise SystemExit('access.ts quota anchor not found')
              s = s.replace(marker, block + '\n' + marker)
          p.write_text(s)

          # Expose customization entitlement from the existing quota hook so the
          # upstream receive UI can keep its API without replacing fork gating.
          p = Path('apps/readest-app/src/hooks/useQuotaStats.ts')
          s = p.read_text()
          s = s.replace(
              "import { getStoragePlanData, getTranslationPlanData, getUserProfilePlan } from '@/utils/access';",
              "import {\n  getCustomizationPurchased,\n  getStoragePlanData,\n  getTranslationPlanData,\n  getUserProfilePlan,\n} from '@/utils/access';",
          )
          state_anchor = "  const [userProfilePlan, setUserProfilePlan] = useState<UserPlan | undefined>(undefined);\n"
          if 'setCustomizationPurchased' not in s:
              if state_anchor not in s:
                  raise SystemExit('useQuotaStats state anchor not found')
              s = s.replace(state_anchor, state_anchor + "  const [customizationPurchased, setCustomizationPurchased] = useState(false);\n")
          if 'setCustomizationPurchased(getCustomizationPurchased(token));' not in s:
              s = s.replace(
                  '    setUserProfilePlan(profilePlan);\n',
                  '    setUserProfilePlan(profilePlan);\n    setCustomizationPurchased(getCustomizationPurchased(token));\n',
              )
          if '    customizationPurchased,\n' not in s:
              s = s.replace('    userProfilePlan,\n', '    userProfilePlan,\n    customizationPurchased,\n')
          p.write_text(s)

          # The upstream gate test assumes the official paywall. Keep its plan
          # helper assertions but assert the community fork unlock at the public gate.
          p = Path('apps/readest-app/src/__tests__/utils/nearby-pairing-plan-gate.test.ts')
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "    expect(isNearbyPairingAllowed('free', false)).toBe(false);",
                  "    expect(isNearbyPairingAllowed('free', false)).toBe(true);",
              )
              s = s.replace(
                  "    expect(isNearbyPairingAllowed('purchase', false)).toBe(false);",
                  "    expect(isNearbyPairingAllowed('purchase', false)).toBe(true);",
              )
              p.write_text(s)
          PY
          }

          echo 'Applying upstream #6023...'
          if ! git cherry-pick "$c6023"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^(Cargo\.lock|apps/readest-app/public/locales/[^/]+/translation\.json|apps/readest-app/src/components/settings/IntegrationsPanel\.tsx|apps/readest-app/src/utils/access\.ts)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected #6023 conflicts:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --ours -- Cargo.lock apps/readest-app/src/components/settings/IntegrationsPanel.tsx apps/readest-app/src/utils/access.ts
            for file in $(printf '%s\n' "$conflicts" | grep '^apps/readest-app/public/locales/' || true); do
              git checkout --ours -- "$file"
            done
            apply_locale_delta "$c6023" "$p6023"
            patch_fork_bookdrop_glue
            # Resolve the git dependency against the fork's existing dependency graph
            # instead of copying upstream's whole Cargo.lock.
            cargo update --manifest-path apps/readest-app/src-tauri/Cargo.toml -p localsend
            # Upstream's Nix vendor hash cannot be copied onto the fork's larger Cargo graph.
            git checkout HEAD -- nix/package.nix
            git add Cargo.lock apps/readest-app/public/locales apps/readest-app/src/components/settings/IntegrationsPanel.tsx apps/readest-app/src/utils/access.ts apps/readest-app/src/hooks/useQuotaStats.ts apps/readest-app/src/__tests__/utils/nearby-pairing-plan-gate.test.ts nix/package.nix
            git cherry-pick --continue
          else
            patch_fork_bookdrop_glue
            cargo update --manifest-path apps/readest-app/src-tauri/Cargo.toml -p localsend
            git checkout HEAD^ -- nix/package.nix || true
            git add Cargo.lock apps/readest-app/src/components/settings/IntegrationsPanel.tsx apps/readest-app/src/utils/access.ts apps/readest-app/src/hooks/useQuotaStats.ts apps/readest-app/src/__tests__/utils/nearby-pairing-plan-gate.test.ts nix/package.nix
            git commit --amend --no-edit
          fi

          echo 'Applying upstream #6049...'
          if ! git cherry-pick "$c6049"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^(apps/readest-app/public/locales/[^/]+/translation\.json|apps/readest-app/src/components/settings/primitives/Tips\.tsx)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected #6049 conflicts:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            for file in $(printf '%s\n' "$conflicts" | grep '^apps/readest-app/public/locales/' || true); do
              git checkout --ours -- "$file"
            done
            if printf '%s\n' "$conflicts" | grep -q 'apps/readest-app/src/components/settings/primitives/Tips.tsx'; then
              git checkout --ours -- apps/readest-app/src/components/settings/primitives/Tips.tsx
            fi
            apply_locale_delta "$c6049" "$p6049"
            git add apps/readest-app/public/locales apps/readest-app/src/components/settings/primitives/Tips.tsx
            git cherry-pick --continue
          fi

          echo 'Applying upstream #6050...'
          git cherry-pick "$c6050"

          git diff --check origin/main...HEAD
          git push origin HEAD:integrate/upstream-nearby-bookdrop-v2-2026-09-04
