name: 临时上游同步合并验证 v2

on:
  push:
    branches:
      - sync-upstream-2026-09-02

permissions:
  contents: write

jobs:
  merge-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch pinned upstream and reviewed resolution branch
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/readest/readest.git
          git fetch upstream b12932da9a489951f2d1a0e0175ed24de61ce183
          git fetch origin sync-upstream-2026-09-02
          resolution_ref="$(git rev-parse origin/sync-upstream-2026-09-02)"
          echo "resolution_ref=$resolution_ref" >> "$GITHUB_OUTPUT"
          echo "fork_main=$(git rev-parse origin/main)"
          echo "upstream=b12932da9a489951f2d1a0e0175ed24de61ce183"
          echo "resolution_ref=$resolution_ref"

      - name: Merge upstream and resolve seven real conflicts
        env:
          RESOLUTION_REF: ${{ steps.refs.outputs.resolution_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync-upstream-2026-09-02 origin/main

          set +e
          git merge --no-ff --no-commit b12932da9a489951f2d1a0e0175ed24de61ce183
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "Merge stopped for manual resolutions as expected."
          fi

          expected_conflicts="$(cat <<'EOF'
          Cargo.lock
          apps/readest-app/public/locales/zh-CN/translation.json
          apps/readest-app/public/locales/zh-TW/translation.json
          apps/readest-app/src/components/settings/IntegrationsPanel.tsx
          apps/readest-app/src/services/bookorbit/statsPush.ts
          apps/readest-app/src/services/sync/cloudSyncProvider.ts
          apps/readest-app/src/utils/access.ts
          EOF
          )"
          actual_conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$actual_conflicts" != "$expected_conflicts" ]; then
            echo "::error::Conflict set changed unexpectedly."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_conflicts" "$actual_conflicts"
            exit 1
          fi

          # Locale conflicts are independent key additions/updates. Preserve
          # fork-only LAN/stats keys and take upstream's value for same-key edits.
          node <<'NODE'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          for (const path of [
            'apps/readest-app/public/locales/zh-CN/translation.json',
            'apps/readest-app/public/locales/zh-TW/translation.json',
          ]) {
            const ours = JSON.parse(cp.execFileSync('git', ['show', `:2:${path}`], { encoding: 'utf8' }));
            const theirs = JSON.parse(cp.execFileSync('git', ['show', `:3:${path}`], { encoding: 'utf8' }));
            fs.writeFileSync(path, `${JSON.stringify({ ...ours, ...theirs }, null, 2)}\n`);
          }
          NODE

          # These four conflicts were manually reviewed on the working branch.
          git checkout "$RESOLUTION_REF" -- \
            Cargo.lock \
            apps/readest-app/src/components/settings/IntegrationsPanel.tsx \
            apps/readest-app/src/services/sync/cloudSyncProvider.ts \
            apps/readest-app/src/utils/access.ts

          # IntegrationsPanel keeps the fork-unlocked UX while supplying the
          # customization entitlement added by upstream's new API.
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/readest-app/src/components/settings/IntegrationsPanel.tsx')
          text = path.read_text()
          old1 = "const { userProfilePlan } = useQuotaStats();"
          new1 = "const { userProfilePlan, customizationPurchased } = useQuotaStats();"
          old2 = "const isCloudSyncPremium = isCloudSyncAllowed(userProfilePlan ?? 'free');"
          new2 = "const isCloudSyncPremium = isCloudSyncAllowed(\n    userProfilePlan ?? 'free',\n    customizationPurchased,\n  );"
          if old1 not in text or old2 not in text:
              raise SystemExit('IntegrationsPanel entitlement call shape changed unexpectedly')
          path.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))
          PY

          # Combine upstream's 500-event batching/startTime boundary safety with
          # the fork's durable per-channel inclusive-cursor boundary memo.
          cat > /tmp/statsPush.ts <<'EOF'
          import type { PageStatEvent, StatBook } from '@/types/statistics';
          import type { PageStatsBookWire } from './types';

          /** Books per page-stats request — the server rejects more than 50. */
          const MAX_BOOKS_PER_REQUEST = 50;
          /** Events per page-stats request — the server rejects more than 500 in total. */
          const MAX_EVENTS_PER_REQUEST = 500;

          export interface StatsPushDb {
            getCursor(key: 'bookorbit-push'): Promise<number>;
            setCursor(key: 'bookorbit-push', value: number): Promise<void>;
            getEventsForPush(
              sinceStartTime: number,
              cursorKey: 'bookorbit-push',
            ): Promise<{ events: PageStatEvent[]; books: StatBook[] }>;
            markEventsPushed(cursorKey: 'bookorbit-push', events: PageStatEvent[]): Promise<void>;
          }

          export interface StatsPushClient {
            uploadPageStats(books: PageStatsBookWire[]): Promise<void>;
          }

          const toWireBooks = (events: PageStatEvent[]): PageStatsBookWire[] => {
            const byHash = new Map<string, PageStatsBookWire>();
            for (const event of events) {
              let book = byHash.get(event.bookMd5);
              if (!book) {
                book = { hash: event.bookMd5, events: [] };
                byHash.set(event.bookMd5, book);
              }
              book.events.push({
                page: event.page,
                startTime: event.startTime,
                durationSeconds: event.duration,
                totalPages: event.totalPages,
              });
            }
            return Array.from(byHash.values());
          };

          export const pushStatsToBookOrbit = async (
            stats: StatsPushDb,
            client: StatsPushClient,
          ): Promise<void> => {
            const cursor = await stats.getCursor('bookorbit-push');
            const { events: rawEvents } = await stats.getEventsForPush(cursor, 'bookorbit-push');
            const events = rawEvents.filter((event) => event.startTime >= 1 && event.totalPages >= 1);
            if (events.length === 0) return;

            let i = 0;
            while (i < events.length) {
              const hashes = new Set<string>();
              let end = i;
              while (end < events.length && end - i < MAX_EVENTS_PER_REQUEST) {
                const event = events[end]!;
                if (!hashes.has(event.bookMd5) && hashes.size === MAX_BOOKS_PER_REQUEST) break;
                hashes.add(event.bookMd5);
                end++;
              }

              if (end < events.length && events[end - 1]!.startTime === events[end]!.startTime) {
                const splitStartTime = events[end]!.startTime;
                let groupStart = end - 1;
                while (groupStart > i && events[groupStart - 1]!.startTime === splitStartTime) {
                  groupStart--;
                }
                if (groupStart > i) end = groupStart;
              }

              const chunk = events.slice(i, end);
              await client.uploadPageStats(toWireBooks(chunk));
              await stats.markEventsPushed('bookorbit-push', chunk);

              const lastStartTime = chunk[chunk.length - 1]!.startTime;
              if (end === events.length || events[end]!.startTime !== lastStartTime) {
                await stats.setCursor('bookorbit-push', lastStartTime);
              }
              i = end;
            }
          };
          EOF
          sed 's/^          //' /tmp/statsPush.ts > apps/readest-app/src/services/bookorbit/statsPush.ts

          # The fork's old StatsPushDb test double treated acknowledged events as
          # globally hidden. Production only hides the memo when its timestamp
          # equals the inclusive cursor. Model that exactly so upstream's new
          # oversized-startTime retry test exercises production semantics.
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/readest-app/src/__tests__/services/bookorbit/statsPush.test.ts')
          text = path.read_text()
          old = """  const acknowledged = new Set<string>();\n  const eventKey = (event: PageStatEvent) => JSON.stringify(event);\n  return {\n    cursors,\n    getCursor: vi.fn(async (key: string) => cursors[key] ?? 0),\n    setCursor: vi.fn(async (key: string, value: number) => {\n      cursors[key] = value;\n    }),\n    getEventsForPush: vi.fn(async (since: number) => ({\n      events: events.filter(\n        (event) => event.startTime >= since && !acknowledged.has(eventKey(event)),\n      ),\n      books: [],\n    })),\n    markEventsPushed: vi.fn(async (_key: string, pushed: PageStatEvent[]) => {\n      for (const event of pushed) acknowledged.add(eventKey(event));\n    }),\n  };"""
          new = """  const acknowledged = new Set<string>();\n  let boundaryStartTime: number | null = null;\n  const eventKey = (event: PageStatEvent) => JSON.stringify(event);\n  return {\n    cursors,\n    getCursor: vi.fn(async (key: string) => cursors[key] ?? 0),\n    setCursor: vi.fn(async (key: string, value: number) => {\n      cursors[key] = value;\n    }),\n    getEventsForPush: vi.fn(async (since: number) => ({\n      events: events.filter(\n        (event) =>\n          event.startTime >= since &&\n          !(\n            boundaryStartTime === since &&\n            event.startTime === since &&\n            acknowledged.has(eventKey(event))\n          ),\n      ),\n      books: [],\n    })),\n    markEventsPushed: vi.fn(async (_key: string, pushed: PageStatEvent[]) => {\n      if (pushed.length === 0) return;\n      const startTime = Math.max(...pushed.map((event) => event.startTime));\n      if (boundaryStartTime !== startTime) {\n        acknowledged.clear();\n        boundaryStartTime = startTime;\n      }\n      for (const event of pushed) {\n        if (event.startTime === startTime) acknowledged.add(eventKey(event));\n      }\n    }),\n  };"""
          if old not in text:
              raise SystemExit('statsPush test helper merge shape changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY

          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Unresolved merge paths remain:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

      - name: Static merge assertions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          for (const locale of ['zh-CN', 'zh-TW']) {
            const data = JSON.parse(fs.readFileSync(`apps/readest-app/public/locales/${locale}/translation.json`, 'utf8'));
            for (const key of ['Gamepad Support', 'Navigate with a connected controller', 'LAN Sync']) {
              if (!data[key]) throw new Error(`${locale} lost translation key: ${key}`);
            }
          }
          NODE
          grep -q 'gamepadEnabled' apps/readest-app/src/types/settings.ts
          grep -q 'gamepadEnabled' apps/readest-app/src/services/constants.ts
          grep -q 'localsend_set_discoverable' apps/readest-app/src-tauri/build.rs
          grep -q 'localsend_set_discoverable' apps/readest-app/src-tauri/src/lib.rs
          grep -q 'allow-localsend-set-discoverable' apps/readest-app/src-tauri/capabilities/default.json
          grep -q "kind !== 'lan'" apps/readest-app/src/services/sync/cloudSyncProvider.ts
          grep -q 'FORK_UNLOCK' apps/readest-app/src/utils/access.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Initialize submodules and frontend vendors
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          pnpm --filter @readest/readest-app setup-vendors

      - name: TypeScript type check
        run: pnpm --filter @readest/readest-app exec tsc --noEmit

      - name: Targeted regression tests
        run: >-
          pnpm --filter @readest/readest-app exec vitest run
          src/__tests__/services/bookorbit/statsPush.test.ts
          src/__tests__/services/sync/cloudSyncProvider.test.ts
          src/__tests__/utils/customization-access.test.ts
          src/__tests__/utils/nearby-pairing-plan-gate.test.ts
          src/__tests__/components/settings/ControlPanelGamepad.test.tsx
          src/__tests__/services/lanSync/pairing.test.ts
          src/__tests__/reader/utils/iframeEventHandlers.test.ts
          src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts

      - name: Cargo lock consistency
        run: cargo metadata --locked --format-version 1 --manifest-path apps/readest-app/src-tauri/Cargo.toml --no-deps > /dev/null

      - name: Commit verified merge and replace working branch
        env:
          RESOLUTION_REF: ${{ steps.refs.outputs.resolution_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "chore: sync upstream main through 2026-09-02"
          git push \
            --force-with-lease=refs/heads/sync-upstream-2026-09-02:"$RESOLUTION_REF" \
            origin HEAD:refs/heads/sync-upstream-2026-09-02
          echo "verified_merge=$(git rev-parse HEAD)"
