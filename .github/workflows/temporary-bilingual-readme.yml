name: Temporary bilingual README migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-bilingual-readme.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Split default English README and Simplified Chinese README
        env:
          EN_B64: 
          ZH_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          switch = '<p align="center">\n  <strong>English</strong> | <a href="./README.zh-CN.md">简体中文</a>\n</p>\n'
          marker = '  <h1>Readest</h1>\n  <br>\n'
          if switch not in text:
              text = text.replace(marker, '  <h1>Readest</h1>\n' + switch + '  <br>\n', 1)
          start = text.find('## 本分支版本下载')
          end = text.find('## Features', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Chinese fork section')
          english = base64.b64decode(os.environ['EN_B64']).decode('utf-8')
          chinese = base64.b64decode(os.environ['ZH_B64']).decode('utf-8')
          path.write_text(text[:start] + english + text[end:], encoding='utf-8')
          Path('README.zh-CN.md').write_text(chinese, encoding='utf-8')
          PY
          rm .github/workflows/temporary-bilingual-readme.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md .github/workflows/temporary-bilingual-readme.yml
          git commit -m 'docs: make English default with Simplified Chinese switch'
          git push origin HEAD:main
