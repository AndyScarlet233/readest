name: Temporary upstream #6066 validation

on:
  push:
    branches:
      - integrate/upstream-6052-6065-2026-09-05

permissions:
  contents: write

jobs:
  validate-upstream-6066:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and replay exact upstream #6066
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=53c0c1686333bc362ddc2a63068bc86cdd11a549
          git remote add official-upstream https://github.com/readest/readest.git || true
          git fetch --no-tags official-upstream main
          test "$(git rev-parse official-upstream/main)" = "$upstream_sha"
          git cherry-pick "$upstream_sha"

          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          expected="$(printf '%s\n' \
            'apps/readest-app/src/__tests__/utils/overlayer-blend-mode.test.ts' \
            'apps/readest-app/src/app/reader/components/FoliateViewer.tsx' \
            'apps/readest-app/src/hooks/useTheme.ts' \
            'apps/readest-app/src/utils/style.ts' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected #6066 changed-file set:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare frontend vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: TypeScript typecheck
        run: pnpm --filter @readest/readest-app exec tsc --noEmit

      - name: Run overlay and fork mouse-pan regressions
        run: >-
          pnpm --filter @readest/readest-app exec vitest run
          src/__tests__/utils/overlayer-blend-mode.test.ts
          src/__tests__/utils/style.test.ts
          src/__tests__/utils/style-dom.test.ts
          src/__tests__/app/reader/hooks/usePagination-mousePan.test.ts
          src/__tests__/reader/utils/iframeEventHandlers.test.ts
          --maxWorkers=2

      - name: Install Chromium for fixed-layout browser regressions
        run: pnpm --filter @readest/readest-app exec playwright install --with-deps chromium

      - name: Run fixed-layout and PDF browser regressions
        run: >-
          pnpm --filter @readest/readest-app exec vitest run
          --config vitest.browser.config.mts
          src/__tests__/document/fixed-layout-pan-lock.browser.test.ts
          src/__tests__/document/pdf-pan-lock.browser.test.ts

      - name: Recheck upstream head and publish clean integration head
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=53c0c1686333bc362ddc2a63068bc86cdd11a549
          git fetch --no-tags official-upstream main
          test "$(git rev-parse official-upstream/main)" = "$upstream_sha"
          git rm .github/workflows/temp-upstream-6066-validation.yml
          git commit -m "chore(upstream): complete replay through #6066"
          git push origin HEAD:${GITHUB_REF_NAME}
