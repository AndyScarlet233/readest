name: Temporary upstream 6067-6090 replay

on:
  push:
    branches:
      - integrate/upstream-6067-6090-2026-09-06

permissions:
  contents: write

jobs:
  replay-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add official-upstream https://github.com/readest/readest.git || true
          git fetch --no-tags official-upstream main

      - name: Replay only upstream commits after 6066
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            dd9a8daa3f6e173d1f7dd7425e4fc71ee1c449ac
            65287bd3eb1d2772c8880f9216b262d1daf0077e
            e56d867fdf823dfb873f5cfcff25b685d61895e0
            a268fd2f02170cfa9ea2384091065f636fa89096
            d761570f0ab09d1fdccb63a668c1ef0f7d4d7189
            ff97b337fbfddb6b794e8c64e4832dfccf24f3e7
            9f1e6a7adba67ebbd363626385ef04a6f2eb0a5d
            860d6d00bce306db2e2830bee729c059a61b526f
            5bae2e37923f6498a4bd2b3c20f627ea947dea37
            655c72ad5a91a0fa42df95f11de3996cf7b3dfac
            3723c1625d3735745e76e8e0e1fdb4d59f059eda
            4918297fef1a8d6d129ff63b3ed2d7402b5fe1d9
            ee86510ccaf736c2cf887add305c5344420ab0a3
            34e4ebeeb500ddf245c0fef0bb6b6cf19651b809
            77e44eb92de25547a58f0b4c8b2e0b4f39c8d1a5
            44bba08f3dfa86a62e7fb39364abbbb864d9c261
            32c42100d06b8b086b1af2449f43a7738f5b54d9
            d13edf4efee3c9b975bb77a991806c7fd9f9b3d6
            04379b8f833983de90d0f5f5db7da3acfb3aa27a
          )
          rm -f .github/upstream-6067-6090-status.txt
          for sha in "${commits[@]}"; do
            if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
              echo "Already present: $sha"
              continue
            fi
            echo "Replaying $sha"
            set +e
            git cherry-pick "$sha"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              continue
            fi

            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$sha" = "dd9a8daa3f6e173d1f7dd7425e4fc71ee1c449ac" ] && [ -n "$conflicts" ]; then
              echo "Resolving #6067 by preserving fork Ctrl+wheel behavior and adding upstream keyboard zoom semantics"
              git checkout --ours -- \
                apps/readest-app/src/app/reader/hooks/useBookShortcuts.ts \
                apps/readest-app/src/services/constants.ts
              python3 <<'PY'
          from pathlib import Path

          hook = Path('apps/readest-app/src/app/reader/hooks/useBookShortcuts.ts')
          text = hook.read_text()

          old = "  const { setSettingsDialogOpen, setSettingsDialogBookKey } = useSettingsStore();"
          new = "  const { settings, setSettingsDialogOpen, setSettingsDialogBookKey } = useSettingsStore();"
          if text.count(old) != 1:
              raise SystemExit('unexpected settingsStore destructuring while resolving #6067')
          text = text.replace(old, new)

          old_zoom = """  const zoomInFactor = (factor = 1.0) => {
            if (!sideBarBookKey) return;
            const viewSettings = getViewSettings(sideBarBookKey)!;
            const zoomLevel = viewSettings!.zoomLevel + ZOOM_STEP * factor;
            applyZoomLevel(Math.min(zoomLevel, MAX_ZOOM_LEVEL));
          };

          const zoomOutFactor = (factor = 1.0) => {
            if (!sideBarBookKey) return;
            const viewSettings = getViewSettings(sideBarBookKey)!;
            const zoomLevel = viewSettings!.zoomLevel - ZOOM_STEP * factor;
            applyZoomLevel(Math.max(zoomLevel, MIN_ZOOM_LEVEL));
          };
"""
          new_zoom = """  const applyFontSize = (fontSize: number) => {
            if (!sideBarBookKey) return;
            const viewSettings = getViewSettings(sideBarBookKey);
            if (!viewSettings) return;
            const minSize = Math.max(
              FONT_SIZE_LIMITS.MIN,
              viewSettings.minimumFontSize ?? FONT_SIZE_LIMITS.MIN,
            );
            const clamped = Math.max(
              minSize,
              Math.min(FONT_SIZE_LIMITS.MAX, Math.round(fontSize)),
            );
            if (clamped === viewSettings.defaultFontSize) return;
            saveViewSettings(envConfig, sideBarBookKey, 'defaultFontSize', clamped, true);
          };

          const isFixedLayout = () => !!getBookData(sideBarBookKey ?? '')?.isFixedLayout;

          const zoomInFactor = (factor = 1.0) => {
            if (!sideBarBookKey) return;
            const viewSettings = getViewSettings(sideBarBookKey)!;
            if (!isFixedLayout()) {
              applyFontSize(viewSettings.defaultFontSize + factor);
              return;
            }
            const zoomLevel = viewSettings!.zoomLevel + ZOOM_STEP * factor;
            applyZoomLevel(Math.min(zoomLevel, MAX_ZOOM_LEVEL));
          };

          const zoomOutFactor = (factor = 1.0) => {
            if (!sideBarBookKey) return;
            const viewSettings = getViewSettings(sideBarBookKey)!;
            if (!isFixedLayout()) {
              applyFontSize(viewSettings.defaultFontSize - factor);
              return;
            }
            const zoomLevel = viewSettings!.zoomLevel - ZOOM_STEP * factor;
            applyZoomLevel(Math.max(zoomLevel, MIN_ZOOM_LEVEL));
          };
"""
          if text.count(old_zoom) != 1:
              raise SystemExit('unexpected zoom factor block while resolving #6067')
          text = text.replace(old_zoom, new_zoom)

          old_save = "      saveViewSettings(envConfig, sideBarBookKey, 'defaultFontSize', size);"
          new_save = "      saveViewSettings(envConfig, sideBarBookKey, 'defaultFontSize', size, true);"
          if text.count(old_save) != 1:
              raise SystemExit('unexpected Ctrl+wheel save call while resolving #6067')
          text = text.replace(old_save, new_save)

          old_reset = """  const resetZoom = () => {
            if (!sideBarBookKey) return;
            applyZoomLevel(100);
          };
"""
          new_reset = """  const resetZoom = () => {
            if (!sideBarBookKey) return;
            if (!isFixedLayout()) {
              applyFontSize(settings.globalViewSettings?.defaultFontSize ?? FONT_SIZE_LIMITS.DEFAULT);
              return;
            }
            applyZoomLevel(100);
          };
"""
          if text.count(old_reset) != 1:
              raise SystemExit('unexpected resetZoom block while resolving #6067')
          text = text.replace(old_reset, new_reset)
          hook.write_text(text)

          test = Path('apps/readest-app/src/__tests__/components/useBookShortcuts.test.tsx')
          test_text = test.read_text()
          marker = "vi.mock('@/services/constants', () => ({\n"
          if marker not in test_text:
              raise SystemExit('constants mock not found in #6067 test')
          if 'FONT_SIZE_LIMITS:' not in test_text:
              test_text = test_text.replace(
                  marker,
                  marker + "  FONT_SIZE_LIMITS: { MIN: 8, MAX: 50, DEFAULT: 16 },\n",
                  1,
              )
          test.write_text(test_text)
          PY
              git add \
                apps/readest-app/src/app/reader/hooks/useBookShortcuts.ts \
                apps/readest-app/src/services/constants.ts \
                apps/readest-app/src/__tests__/components/useBookShortcuts.test.tsx
              git cherry-pick --continue
              continue
            fi

            if [ -z "$conflicts" ]; then
              echo "No unresolved paths; treating as empty/already-applied cherry-pick"
              git cherry-pick --skip || git cherry-pick --abort || true
              continue
            fi

            echo "Conflict in $sha"
            printf '%s\n' "$conflicts"
            git status --short
            git diff --cc --stat || true
            git cherry-pick --abort
            printf 'status=conflict\ncommit=%s\nconflicts:\n%s\n' "$sha" "$conflicts" > .github/upstream-6067-6090-status.txt
            git add .github/upstream-6067-6090-status.txt
            git commit -m "ci: record upstream 6067-6090 replay conflict"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Finalize successful replay
        if: steps.replay.outputs.complete == 'true'
        run: |
          printf 'status=complete\ntarget=04379b8f833983de90d0f5f5db7da3acfb3aa27a\n' > .github/upstream-6067-6090-status.txt
          git add .github/upstream-6067-6090-status.txt
          git rm .github/workflows/temp-upstream-6067-6090.yml
          git commit -m "chore(upstream): record replay through #6090"
          git push origin HEAD:${GITHUB_REF_NAME}
