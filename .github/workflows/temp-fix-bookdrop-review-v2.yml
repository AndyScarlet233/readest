name: Temporary fix BookDrop review findings v2

on:
  push:
    branches:
      - integrate/upstream-nearby-bookdrop-v2-2026-09-04
    paths:
      - .github/workflows/temp-fix-bookdrop-review-v2.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_POSTHOG_KEY: ''
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply verified CodeRabbit fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # Sinhala singular noun.
          replace_once(
              'apps/readest-app/public/locales/si/translation.json',
              '  "{{alias}} wants to send you {{count}} book(s)_one": "{{alias}} ඔබට පොත් {{count}}ක් යැවීමට කැමතියි",',
              '  "{{alias}} wants to send you {{count}} book(s)_one": "{{alias}} ඔබට පොතක් යැවීමට කැමතියි",',
          )

          # Bound departed-peer memory and snapshot cost.
          service_path = Path('apps/readest-app/src-tauri/src/localsend/service.rs')
          service = service_path.read_text()
          old_snapshot = '    let departed = departed.lock().unwrap().clone();'
          new_snapshot = (
              '    let departed = {\n'
              '        let mut departed = departed.lock().unwrap();\n'
              '        departed.retain(|_, at| peer_has_departed(Some(*at), now));\n'
              '        departed.clone()\n'
              '    };'
          )
          if service.count(old_snapshot) != 1:
              raise SystemExit('service.rs departure snapshot anchor mismatch')
          service = service.replace(old_snapshot, new_snapshot, 1)
          test_marker = '\n    #[test]\n    fn register_peer_ignores_own_fingerprint() {'
          if service.count(test_marker) != 1:
              raise SystemExit('service.rs test insertion anchor mismatch')
          prune_test = (
              '\n    #[test]\n'
              '    fn device_payloads_prunes_expired_departures() {\n'
              '        let dir = std::env::temp_dir().join(format!("ls-prune-{}", std::process::id()));\n'
              '        std::fs::create_dir_all(&dir).unwrap();\n'
              '        let _ = std::fs::remove_file(dir.join("identity.pem"));\n'
              '        let identity =\n'
              '            Identity::load_or_generate(&dir, "Readest".into(), "macOS".into()).unwrap();\n'
              '        let discovery = test_discovery(&identity);\n'
              '        let now = SystemTime::now();\n'
              '        let departed: DepartedPeers = Arc::new(StdMutex::new(HashMap::from([\n'
              '            ("fresh".to_string(), now),\n'
              '            (\n'
              '                "stale".to_string(),\n'
              '                now - DEPARTURE_HOLD - Duration::from_secs(1),\n'
              '            ),\n'
              '        ])));\n\n'
              '        let _ = device_payloads(&discovery, &departed);\n\n'
              '        let departed = departed.lock().unwrap();\n'
              '        assert!(departed.contains_key("fresh"));\n'
              '        assert!(!departed.contains_key("stale"));\n'
              '        drop(departed);\n'
              '        let _ = std::fs::remove_dir_all(&dir);\n'
              '    }\n'
          )
          service_path.write_text(service.replace(test_marker, prune_test + test_marker, 1))

          # Never hide the in-flight cancel affordance just because service status drops.
          replace_once(
              'apps/readest-app/src/components/localsend/DevicePickerDialog.tsx',
              '          {!status?.running ? (',
              '          {!status?.running && !sendState ? (',
          )
          replace_once(
              'apps/readest-app/src/components/localsend/DevicePickerDialog.tsx',
              '          {status?.running && sendState && (',
              '          {sendState && (',
          )

          # A stale foreground liveness probe must not re-enable discovery after hidden/unmount.
          manager_path = Path('apps/readest-app/src/components/localsend/LocalSendManager.tsx')
          manager = manager_path.read_text()
          old = """  useEffect(() => {
              if (!isTauriAppPlatform()) return;
              const sync = async () => {
                if (!isLocalSendEnabled()) return;
                const visible = document.visibilityState === 'visible';
                if (!visible) {
                  void setLocalSendDiscoverable(false).catch(() => {});
                  return;
                }
                // The OS can reclaim a backgrounded app's listening socket (iOS). When
                // the core notices, it tears the dead service down and reports
                // running:false - but iOS never wakes the accept loop to notice, so the
                // status stays running:true on a service no peer can reach (the picker
                // showed nothing until the user toggled the setting off and on). Trust a
                // liveness probe, not the stored flag, and rebuild the service when it
                // fails: `stop` first, or `start` would hand back the dead one.
                if (!(await isLocalSendAlive().catch(() => false))) {
                  await stopLocalSend().catch(() => {});
                  void syncServiceState();
                  return;
                }
                void setLocalSendDiscoverable(true).catch(() => {});
              };
              const onVisibilityChange = () => void sync();
              document.addEventListener('visibilitychange', onVisibilityChange);
              return () => document.removeEventListener('visibilitychange', onVisibilityChange);
            }, [syncServiceState]);"""
          new = """  useEffect(() => {
              if (!isTauriAppPlatform()) return;
              let generation = 0;
              let disposed = false;
              const sync = async () => {
                const currentGeneration = ++generation;
                if (!isLocalSendEnabled()) return;
                const visible = document.visibilityState === 'visible';
                if (!visible) {
                  void setLocalSendDiscoverable(false).catch(() => {});
                  return;
                }
                // The OS can reclaim a backgrounded app's listening socket (iOS). When
                // the core notices, it tears the dead service down and reports
                // running:false - but iOS never wakes the accept loop to notice, so the
                // status stays running:true on a service no peer can reach (the picker
                // showed nothing until the user toggled the setting off and on). Trust a
                // liveness probe, not the stored flag, and rebuild the service when it
                // fails: `stop` first, or `start` would hand back the dead one.
                const alive = await isLocalSendAlive().catch(() => false);
                if (
                  disposed ||
                  currentGeneration !== generation ||
                  document.visibilityState !== 'visible'
                ) {
                  return;
                }
                if (!alive) {
                  await stopLocalSend().catch(() => {});
                  void syncServiceState();
                  return;
                }
                void setLocalSendDiscoverable(true).catch(() => {});
              };
              const onVisibilityChange = () => void sync();
              document.addEventListener('visibilitychange', onVisibilityChange);
              return () => {
                disposed = true;
                generation += 1;
                document.removeEventListener('visibilitychange', onVisibilityChange);
              };
            }, [syncServiceState]);"""
          if manager.count(old) != 1:
              raise SystemExit(f'LocalSendManager presence anchor mismatch: {manager.count(old)}')
          manager_path.write_text(manager.replace(old, new, 1))

          # Regression for the visibility race.
          presence_path = Path('apps/readest-app/src/__tests__/components/localsend/LocalSendManagerPresence.test.tsx')
          presence = presence_path.read_text()
          end_marker = "\n  it('goes quiet on the way out without probing', async () => {\n"
          if presence.count(end_marker) != 1:
              raise SystemExit('presence-test insertion anchor mismatch')
          # Insert the new test immediately before the existing hidden-path test.
          stale_test = """
            it('does not let a stale visible probe re-enable discovery after hiding', async () => {
              await mountManager();
              let resolveAlive: ((value: boolean) => void) | undefined;
              isLocalSendAlive.mockImplementationOnce(
                () =>
                  new Promise<boolean>((resolve) => {
                    resolveAlive = resolve;
                  }),
              );

              setVisibility('visible');
              await act(async () => {
                document.dispatchEvent(new Event('visibilitychange'));
                await Promise.resolve();
              });
              expect(isLocalSendAlive).toHaveBeenCalledTimes(1);

              await changeVisibilityTo('hidden');
              expect(setLocalSendDiscoverable).toHaveBeenCalledWith(false);

              await act(async () => {
                resolveAlive?.(true);
                await Promise.resolve();
                await Promise.resolve();
              });

              expect(setLocalSendDiscoverable).not.toHaveBeenCalledWith(true);
            });
          """
          presence_path.write_text(presence.replace(end_marker, '\n' + stale_test + end_marker, 1))

          # Regression for send cancellation after service state drops.
          Path('apps/readest-app/src/__tests__/components/localsend/DevicePickerDialogStatus.test.tsx').write_text("""import { act, cleanup, render, screen } from '@testing-library/react';
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
          import { initialLocalSendState, useLocalSendStore } from '@/store/localsendStore';
          import type { LocalSendStatus, SendFileInput } from '@/services/localsend/types';

          vi.mock('@/hooks/useTranslation', () => ({ useTranslation: () => (s: string) => s }));
          vi.mock('@/context/EnvContext', () => ({
            useEnv: () => ({ appService: { isAndroidApp: false, isIOSApp: false } }),
          }));
          vi.mock('@/store/themeStore', () => ({
            useThemeStore: () => ({ safeAreaInsets: { bottom: 0 } }),
          }));
          vi.mock('@/store/settingsStore', () => ({
            useSettingsStore: {
              getState: () => ({
                setRequestedPanel: vi.fn(),
                setRequestedSubPage: vi.fn(),
                setSettingsDialogOpen: vi.fn(),
              }),
            },
          }));
          vi.mock('@/services/localsend/pairedDevices', () => ({ isPairedDevice: () => false }));
          vi.mock('@/services/localsend/preview', () => ({ previewDataUrl: () => null }));

          const cancelLocalSendSend = vi.fn(async () => {});
          vi.mock('@/services/localsend/service', () => ({
            announceLocalSend: vi.fn(async () => {}),
            cancelLocalSendSend: () => cancelLocalSendSend(),
            listLocalSendDevices: vi.fn(async () => []),
            sendLocalSendFiles: vi.fn(async () => {}),
          }));

          import DevicePickerDialog from '@/components/localsend/DevicePickerDialog';

          const runningStatus: LocalSendStatus = {
            running: true,
            alias: 'This Device',
            port: 53318,
            fingerprint: 'self',
            deviceModel: 'Windows',
            localIps: ['192.168.1.10'],
            multicastError: null,
          };
          const files: SendFileInput[] = [
            { path: '/tmp/book.epub', fileName: 'book.epub', mimeType: 'application/epub+zip' },
          ];

          beforeEach(() => {
            vi.clearAllMocks();
            useLocalSendStore.setState(initialLocalSendState);
            useLocalSendStore.getState().setStatus(runningStatus);
            useLocalSendStore.getState().startSend('Peer', 'peer-fp');
          });
          afterEach(() => cleanup());

          describe('DevicePickerDialog send lifecycle', () => {
            it('keeps Cancel available if the service reports stopped mid-send', async () => {
              render(<DevicePickerDialog files={files} onClose={vi.fn()} />);
              expect(screen.getByRole('button', { name: 'Cancel' })).toBeTruthy();

              await act(async () => {
                useLocalSendStore.getState().setStatus({ ...runningStatus, running: false });
              });

              expect(screen.getByRole('button', { name: 'Cancel' })).toBeTruthy();
              expect(
                screen.queryByText('Enable Nearby BookDrop in Settings to send books.'),
              ).toBeNull();
            });
          });
          """)
          PY

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors

      - name: Format touched frontend files
        run: >-
          pnpm exec biome format --write
          apps/readest-app/src/components/localsend/DevicePickerDialog.tsx
          apps/readest-app/src/components/localsend/LocalSendManager.tsx
          apps/readest-app/src/__tests__/components/localsend/LocalSendManagerPresence.test.tsx
          apps/readest-app/src/__tests__/components/localsend/DevicePickerDialogStatus.test.tsx

      - name: Run focused Nearby BookDrop regressions
        run: >-
          pnpm --filter @readest/readest-app exec vitest run
          src/__tests__/components/localsend/LocalSendManagerPresence.test.tsx
          src/__tests__/components/localsend/DevicePickerDialogStatus.test.tsx
          src/__tests__/components/localsend/ReceiveRequestPairing.test.tsx
          src/__tests__/services/localsend/deviceModel.test.ts
          src/__tests__/services/localsend/devicePrefs.test.ts
          src/__tests__/services/localsend/pairedDevices.test.ts
          src/__tests__/services/localsend/sounds.test.ts
          src/__tests__/store/localsendStore.test.ts
          src/__tests__/utils/nearby-pairing-plan-gate.test.ts
          --maxWorkers=2

      - name: Validate and push final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add \
            apps/readest-app/public/locales/si/translation.json \
            apps/readest-app/src-tauri/src/localsend/service.rs \
            apps/readest-app/src/components/localsend/DevicePickerDialog.tsx \
            apps/readest-app/src/components/localsend/LocalSendManager.tsx \
            apps/readest-app/src/__tests__/components/localsend/LocalSendManagerPresence.test.tsx \
            apps/readest-app/src/__tests__/components/localsend/DevicePickerDialogStatus.test.tsx
          git rm \
            .github/workflows/temp-fix-bookdrop-review.yml \
            .github/workflows/temp-fix-bookdrop-review-v2.yml
          git commit -m 'fix(bookdrop): address review lifecycle races'
          git push --no-verify origin HEAD:integrate/upstream-nearby-bookdrop-v2-2026-09-04
