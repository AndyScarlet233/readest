name: Temporary upstream gamepad apply

on:
  push:
    branches:
      - integrate/upstream-gamepad-complete-2026-09-04
    paths:
      - .github/workflows/temp-upstream-gamepad-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply upstream gamepad commit without replacing fork locales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-tags upstream b12932da9a489951f2d1a0e0175ed24de61ce183
          if ! git cherry-pick b12932da9a489951f2d1a0e0175ed24de61ce183; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^apps/readest-app/public/locales/[^/]+/translation\.json$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected non-locale gamepad conflicts:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            for file in $conflicts; do
              git checkout --ours -- "$file"
              git add "$file"
            done
            python - <<'PY'
          import json
          from pathlib import Path
          additions = {
              'zh-CN': {
                  'Gamepad Support': '游戏手柄支持',
                  'Navigate with a connected controller': '使用已连接的控制器进行导航',
              },
              'zh-TW': {
                  'Gamepad Support': '手把支援',
                  'Navigate with a connected controller': '使用已連接的手把進行導覽',
              },
          }
          for locale, values in additions.items():
              path = Path(f'apps/readest-app/public/locales/{locale}/translation.json')
              data = json.loads(path.read_text())
              data.update(values)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
            git add apps/readest-app/public/locales/zh-CN/translation.json apps/readest-app/public/locales/zh-TW/translation.json
            git cherry-pick --continue
          fi

          missing=0
          for file in apps/readest-app/public/locales/*/translation.json; do
            case "$file" in
              */en/translation.json) continue ;;
            esac
            if ! grep -Fq '"Gamepad Support"' "$file" || ! grep -Fq '"Navigate with a connected controller"' "$file"; then
              echo "Missing Gamepad translations in $file"
              missing=1
            fi
          done
          test "$missing" -eq 0

          git diff --check HEAD~1..HEAD
          git push origin HEAD:integrate/upstream-gamepad-complete-2026-09-04
