name: Temporary upstream cherry-pick

on:
  push:
    branches:
      - integrate/upstream-6052-6065-2026-09-05

permissions:
  contents: write

jobs:
  replay-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add official-upstream https://github.com/readest/readest.git || true
          git fetch --no-tags official-upstream main

      - name: Replay PDF annotator fix and restore missing upstream test
        shell: bash
        run: |
          set -euo pipefail
          sha=19989d272d9316ac1e1d22767116280b22de017b
          test_path=apps/readest-app/src/__tests__/components/annotator/AnnotatorLookupSurfaces.test.tsx
          rm -f .github/upstream-cherry-pick-status.txt

          if git cat-file -e "HEAD:${test_path}" 2>/dev/null; then
            echo "Expected fork branch to have no pre-existing ${test_path}; refusing automatic resolution" >&2
            exit 1
          fi

          set +e
          git cherry-pick "$sha"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicts" != "$test_path" ]; then
            echo "Unexpected conflicts while replaying #6063:" >&2
            printf '%s\n' "$conflicts" >&2
            git cherry-pick --abort
            exit 1
          fi

          git checkout --theirs -- "$test_path"
          git add "$test_path"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved paths remain after restoring upstream test" >&2
            git cherry-pick --abort
            exit 1
          fi
          git cherry-pick --continue

      - name: Replay documentation and dependency security commits with conflict stop
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            21cabdbc8fade5216bbc8dd2fd286df2dd842aab
            c29a5f9868a00bb4dc945cdf2bd7cc245e74011f
          )
          for sha in "${commits[@]}"; do
            echo "Replaying $sha"
            set +e
            git cherry-pick "$sha"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              git cherry-pick --abort
              printf 'status=conflict\ncommit=%s\nconflicts:\n%s\n' "$sha" "$conflicts" > .github/upstream-cherry-pick-status.txt
              git add .github/upstream-cherry-pick-status.txt
              git commit -m "ci: record upstream cherry-pick conflict"
              git push origin HEAD:${GITHUB_REF_NAME}
              echo "complete=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Finalize successful replay
        if: steps.replay.outputs.complete == 'true'
        run: |
          git rm --ignore-unmatch .github/upstream-cherry-pick-status.txt
          git rm .github/workflows/temp-upstream-cherry-pick.yml
          git commit -m "chore(upstream): complete replay through #6065"
          git push origin HEAD:${GITHUB_REF_NAME}
