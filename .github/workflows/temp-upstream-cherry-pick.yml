name: Temporary upstream cherry-pick

on:
  push:
    branches:
      - integrate/upstream-6052-6065-2026-09-05

permissions:
  contents: write

jobs:
  replay-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add official-upstream https://github.com/readest/readest.git || true
          git fetch --no-tags official-upstream main

      - name: Replay upstream agent-memory update without overwriting fork memory
        shell: bash
        run: |
          set -euo pipefail
          sha=21cabdbc8fade5216bbc8dd2fd286df2dd842aab
          keep_a=apps/readest-app/.claude/memory/MEMORY.md
          keep_b=apps/readest-app/.claude/memory/kosync-percentage-reanchor-impossible-path-5980.md
          rm -f .github/upstream-cherry-pick-status.txt

          set +e
          git cherry-pick "$sha"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n%s\n' "$keep_a" "$keep_b" | sort)"
          if [ "$conflicts" != "$expected" ]; then
            echo "Unexpected conflicts while replaying #6064:" >&2
            printf '%s\n' "$conflicts" >&2
            git cherry-pick --abort
            exit 1
          fi

          git checkout --ours -- "$keep_a" "$keep_b"
          git add "$keep_a" "$keep_b"
          git cherry-pick --continue

      - name: Replay dependency security update with conflict stop
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          sha=c29a5f9868a00bb4dc945cdf2bd7cc245e74011f
          set +e
          git cherry-pick "$sha"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            git cherry-pick --abort
            printf 'status=conflict\ncommit=%s\nconflicts:\n%s\n' "$sha" "$conflicts" > .github/upstream-cherry-pick-status.txt
            git add .github/upstream-cherry-pick-status.txt
            git commit -m "ci: record upstream cherry-pick conflict"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Finalize successful replay
        if: steps.replay.outputs.complete == 'true'
        run: |
          git rm --ignore-unmatch .github/upstream-cherry-pick-status.txt
          git rm .github/workflows/temp-upstream-cherry-pick.yml
          git commit -m "chore(upstream): complete replay through #6065"
          git push origin HEAD:${GITHUB_REF_NAME}
