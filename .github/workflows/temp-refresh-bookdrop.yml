name: Temporary refresh BookDrop integration

on:
  push:
    branches:
      - integrate/upstream-nearby-bookdrop-v2-2026-09-04
    paths:
      - .github/workflows/temp-refresh-bookdrop.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge latest main and finalize branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^apps/readest-app/public/locales/[^/]+/translation\.json$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected non-locale BookDrop refresh conflicts:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def load_stage(stage: int, path: str):
              return json.loads(subprocess.check_output(['git', 'show', f':{stage}:{path}'], text=True))

          missing = object()
          conflicts = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines()
          for rel in conflicts:
              base = load_stage(1, rel)
              ours = load_stage(2, rel)
              theirs = load_stage(3, rel)
              merged = dict(ours)
              for key in dict.fromkeys([*base.keys(), *ours.keys(), *theirs.keys()]):
                  b = base.get(key, missing)
                  o = ours.get(key, missing)
                  t = theirs.get(key, missing)
                  if o == t:
                      value = o
                  elif o == b:
                      value = t
                  elif t == b:
                      value = o
                  else:
                      raise SystemExit(f'Conflicting locale key in {rel}: {key}')
                  if value is missing:
                      merged.pop(key, None)
                  else:
                      merged[key] = value
              Path(rel).write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n')
          PY
            git add apps/readest-app/public/locales/*/translation.json
            git commit --no-edit
          fi
          rm -f .github/workflows/temp-bookdrop-js-tests.yml .github/workflows/temp-refresh-bookdrop.yml
          git add -u .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'ci: clean temporary BookDrop validation workflows'
          fi
          git diff --check origin/main...HEAD
          git push --no-verify origin HEAD:integrate/upstream-nearby-bookdrop-v2-2026-09-04
